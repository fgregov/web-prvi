<!doctype html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Renvara · Postavljanje lozinke</title>
    <link rel="icon" href="/brand/renvara-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    />
    <link rel="stylesheet" href="/login/login.css" />
    <script src="/login/set-password.js" defer></script>
  </head>
  <body>
    <div class="page">
      <header class="brand">
        <img
          class="brand__logo"
          src="/brand/renvara-logo.png"
          alt="Renvara"
          width="81"
          height="94"
        />
        <span class="brand__name">RENVARA</span>
      </header>

      <main class="signin">
        <div class="intro">
          <h1>Postavite lozinku</h1>
          <p>Lozinku birate sami; administrator je ne vidi.</p>
        </div>

        <form id="setpw-form" class="form" novalidate>
          <div class="field-group">
            <label class="label" for="setpw-password">Nova lozinka</label>
            <div class="password">
              <input
                class="password__input"
                id="setpw-password"
                name="setpw-password"
                type="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="128"
                placeholder="Najmanje 12 znakova"
                required
                aria-describedby="setpw-password-error setpw-rules"
              />
              <button
                class="password__toggle"
                type="button"
                data-toggle="setpw-password"
                aria-label="Prikaži lozinku"
                aria-pressed="false"
              >
                <svg class="icon icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18"></path>
                  <path
                    d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5.4-1.6"
                  ></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
            <p class="field-error" id="setpw-password-error" hidden></p>
          </div>

          <div class="field-group">
            <label class="label" for="setpw-confirm">Ponovite novu lozinku</label>
            <div class="password">
              <input
                class="password__input"
                id="setpw-confirm"
                name="setpw-confirm"
                type="password"
                autocomplete="new-password"
                minlength="12"
                maxlength="128"
                placeholder="Ista lozinka još jednom"
                required
                aria-describedby="setpw-confirm-error setpw-rules"
              />
              <button
                class="password__toggle"
                type="button"
                data-toggle="setpw-confirm"
                aria-label="Prikaži lozinku"
                aria-pressed="false"
              >
                <svg class="icon icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18"></path>
                  <path
                    d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5.4-1.6"
                  ></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
            <p class="field-error" id="setpw-confirm-error" hidden></p>
          </div>

          <p class="hint" id="setpw-rules">
            Najmanje 12 znakova, barem jedno slovo i jedna znamenka. Ne smije sadržavati vaše ime ni
            e-mail adresu.
          </p>

          <p class="form-message" id="setpw-message" role="alert" aria-live="assertive" hidden></p>

          <button class="primary" id="setpw-submit" type="submit">Spremi lozinku</button>
        </form>
        <a class="text-button text-button--link" href="/login">Natrag na prijavu</a>
      </main>
    </div>
  </body>
</html>
