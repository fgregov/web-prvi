<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
</head>
<body>
<title>Renvara Mobile Demo</title>
<meta name="theme-color" content="#ffffff" />
<style id="rv-shell-css">
  /* Renvara demo shell. The app is light-only by design (see prototypes/home). */
  :root {
    color-scheme: light;
    --rv-demo-bg: #ffffff;
    --rv-demo-muted: #737982;
    --rv-demo-note-bg: #fff1f1;
    --rv-demo-note-ink: #c81e1e;
  }
  body {
    background: var(--rv-demo-bg);
  }
  #rv-root:empty::before {
    content: 'Učitavanje Renvare…';
    display: block;
    padding: 48px 16px;
    color: var(--rv-demo-muted);
    font:
      15px -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      Arial,
      sans-serif;
    text-align: center;
  }
  .intro .demo-note {
    margin: 12px 0 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--rv-demo-note-bg);
    color: var(--rv-demo-note-ink);
    font-size: 13px;
    line-height: 1.4;
  }
</style>
<div id="rv-root"></div>
<!-- Phone frame for the mobile demo build (node demo/build.ts --mobile).
     On a wide screen with a mouse, the app runs inside a phone-sized frame
     (an iframe with the same page, so its own mobile layout applies) next to
     a short guide. Phones and tablets get the app full screen, as before.
     If the frame does not start, the app runs directly in this page. -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
/>
<style>
  /* Layout: guide on the left, the phone on the right; stacked when narrow. */
  :root {
    --stage-bg: #f3f1ef;
    --stage-ink: #17181b;
    --stage-muted: #575c66;
    --stage-accent: #d91f1f;
    --stage-line: #e2ddd9;
    --stage-button: #ffffff;
    --phone-body: #121316;
    --phone-edge: #34363c;
    --phone-shadow: rgb(23 24 27 / 0.28);
    --stage-font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root.rv-framed:not([data-theme='light']) {
      --stage-bg: #121315;
      --stage-ink: #f1f1f3;
      --stage-muted: #a6aab3;
      --stage-accent: #ff5d52;
      --stage-line: #2b2d32;
      --stage-button: #1c1e22;
      --phone-body: #050506;
      --phone-edge: #43464e;
      --phone-shadow: rgb(0 0 0 / 0.6);
      color-scheme: dark;
    }
  }
  :root.rv-framed[data-theme='dark'] {
    --stage-bg: #121315;
    --stage-ink: #f1f1f3;
    --stage-muted: #a6aab3;
    --stage-accent: #ff5d52;
    --stage-line: #2b2d32;
    --stage-button: #1c1e22;
    --phone-body: #050506;
    --phone-edge: #43464e;
    --phone-shadow: rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
  :root.rv-framed body {
    background: var(--stage-bg);
    color: var(--stage-ink);
  }
  :root.rv-framed #rv-root {
    display: none;
  }
  .rv-stage {
    --s: 1;
    box-sizing: border-box;
    min-height: 100vh;
    padding: 32px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 32px 64px;
    font-family: var(--stage-font);
  }
  .rv-guide {
    flex: 0 1 340px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .rv-guide__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.02em;
  }
  .rv-guide__brand img {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }
  .rv-guide h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.15;
    font-weight: 800;
    text-wrap: balance;
  }
  .rv-guide p {
    margin: 0;
    color: var(--stage-muted);
    font-size: 15px;
    line-height: 1.55;
  }
  .rv-guide h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stage-muted);
  }
  .rv-guide ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    line-height: 1.45;
  }
  .rv-guide li {
    padding-left: 16px;
    position: relative;
  }
  .rv-guide li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.6em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--stage-accent);
  }
  .rv-guide__note {
    padding-top: 16px;
    border-top: 1px solid var(--stage-line);
    font-size: 13px;
  }
  .rv-guide__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .rv-guide__actions button {
    font: 600 14px var(--stage-font);
    color: var(--stage-ink);
    background: var(--stage-button);
    border: 1px solid var(--stage-line);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .rv-guide__actions button:hover {
    border-color: var(--stage-muted);
  }
  .rv-guide__actions button:focus-visible {
    outline: 2px solid var(--stage-accent);
    outline-offset: 2px;
  }
  /* Stacked (too narrow for side by side): the phone first. */
  @media (max-width: 879px) {
    .rv-phone-slot {
      order: -1;
    }
  }
  .rv-phone-slot {
    flex: none;
    width: calc(414px * var(--s));
    height: calc(868px * var(--s));
  }
  .rv-phone {
    box-sizing: border-box;
    width: 414px;
    height: 868px;
    padding: 12px;
    border-radius: 58px;
    background: var(--phone-body);
    box-shadow:
      0 0 0 2px var(--phone-edge),
      0 36px 70px -24px var(--phone-shadow);
    transform: scale(var(--s));
    transform-origin: top left;
  }
  .rv-phone__screen {
    width: 390px;
    height: 844px;
    border-radius: 46px;
    overflow: hidden;
    background: #ffffff;
  }
  .rv-phone iframe {
    display: block;
    width: 390px;
    height: 844px;
    border: 0;
  }
</style>
<script>
  (() => {
    const wide = matchMedia(
      '(min-width: 760px) and (min-height: 560px) and (hover: hover) and (pointer: fine)',
    ).matches;
    if (!wide) return;
    window.__rvFramed = true;
    document.documentElement.classList.add('rv-framed');

    const KEYS = [
      'renvara.demo.crm.v1',
      'renvara.demo.auth',
      'renvara.demo.nav',
      'renvara.dashboard.period',
    ];
    const forget = () => {
      for (const store of ['localStorage', 'sessionStorage']) {
        try {
          for (const key of KEYS) window[store].removeItem(key);
        } catch {
          /* storage blocked: the app keeps its data in memory only */
        }
      }
    };

    function mount() {
      const app = document.getElementById('rv-app')?.textContent ?? '';
      const shellCss = document.getElementById('rv-shell-css')?.textContent ?? '';
      // The same page for the frame, with the reset the artifact host adds around it.
      const page =
        '<!doctype html><html lang="hr"><head><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
        '<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}' +
        'img{max-width:100%}[hidden]{display:none!important}' +
        shellCss +
        '</style></head><body><div id="rv-root"></div><script>' +
        app +
        '<\/script><script>const rvWait=setInterval(()=>{if(document.getElementById("rv-root").children.length){clearInterval(rvWait);parent.postMessage({rvFrame:"ready"},"*")}},100)<\/script></body></html>';

      const stage = document.createElement('main');
      stage.className = 'rv-stage';
      stage.innerHTML = document.getElementById('rv-frame-guide').innerHTML;
      const screen = stage.querySelector('.rv-phone__screen');
      let frame = null;
      /** A fresh frame: a new app start (same as reopening the page). */
      const open = () => {
        const next = document.createElement('iframe');
        next.title = 'Renvara, mobilna aplikacija';
        next.srcdoc = page;
        if (frame) frame.replaceWith(next);
        else screen.append(next);
        frame = next;
      };
      document.body.prepend(stage);

      const fit = () => {
        const s = Math.max(0.5, Math.min(1, (innerHeight - 64) / 868, (innerWidth - 48) / 414));
        stage.style.setProperty('--s', s.toFixed(3));
      };
      fit();
      addEventListener('resize', fit);

      let started = false;
      addEventListener('message', (event) => {
        if (event.source === frame.contentWindow && event.data?.rvFrame === 'ready') started = true;
      });

      /** The app directly in this page (no frame): the fallback, and "full window". */
      const unframe = () => {
        stage.remove();
        removeEventListener('resize', fit);
        document.documentElement.classList.remove('rv-framed');
        window.__rvFramed = false;
        const script = document.createElement('script');
        script.textContent = app;
        document.body.append(script);
      };
      setTimeout(() => {
        if (!started) unframe();
      }, 8000);

      stage.querySelector('[data-action="restart"]').addEventListener('click', () => {
        forget();
        open();
      });
      stage.querySelector('[data-action="unframe"]').addEventListener('click', () => {
        started = true;
        unframe();
      });
      open();
    }
    document.addEventListener('DOMContentLoaded', mount);
  })();
</script>

    <h1 id="rv-guide-title">Mobilni demo</h1>
    <p>
      Renvara kakvu vide prodajni timovi na mobitelu: Sales Kalendar, prioriteti, leadovi, prilike,
      ponude i podsjetnici, s primjerima podataka.
    </p>
    <div>
      <h2>Isprobajte</h2>
      <ul>
        <li>
          Početna: kartice WON i LOST prebacite s # na %, Feedback overview pokazuje koliko dana
          ponuda čeka.
        </li>
        <li>„+” → Novi lead, uz „Označi kao Prospect”.</li>
        <li>Kupci → Initium → Prilike: Ponuda poslana, Dobiveno, Izgubljeno.</li>
        <li>Lead → Kreiraj priliku → Dobiveno → Pretvori u kupca.</li>
        <li>Lead → Dodaj zadatak, s podsjetnikom.</li>
        <li>Odaberite prošli kvartal za povijesni pregled.</li>
      </ul>
    </div>
    <p class="rv-guide__note">
      Prijava prihvaća bilo koje korisničko ime i lozinku. Promjene ostaju samo u ovom pregledniku i
      svaki dan se vraćaju na primjere. Push podsjetnici se u demou spremaju, ali ne stižu na
      uređaj. Na mobitelu otvorite istu poveznicu za prikaz preko cijelog zaslona.
    </p>

    </div>

      <main class="signin">
        <div class="intro">
          <h1>Dobro došli natrag</h1>
          <p>Prijavite se i pogledajte što slijedi.</p>
<p class="demo-note">Demo: prijava prihvaća bilo koje korisničko ime i lozinku. Podaci se spremaju samo u ovom pregledniku.</p>
        </div>

        <form id="login-form" class="form" novalidate>
          <div class="field-group">
            <label class="label" for="login-username">Korisničko ime</label>
            <input
              class="input"
              id="login-username"
              name="username"
              value="demo"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              maxlength="128"
              placeholder="Vaše korisničko ime"
              required
              aria-describedby="login-message"
            />
          </div>

          <div class="field-group">
            <label class="label" for="login-password">Lozinka</label>
            <div class="password">
              <input
                class="password__input"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="512"
                placeholder="Vaša lozinka"
                required
                aria-describedby="login-message"
              value="demo" />
              <button
                class="password__toggle"
                id="password-toggle"
                type="button"
                aria-label="Prikaži lozinku"
                aria-pressed="false"
              >
                <svg class="icon icon--show" viewBox="0 0 24 24" aria-hidden="true">

                </svg>
                <svg class="icon icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18"></path>
                  <path
                    d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5.4-1.6"
                  ></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="forgot">
            <button class="text-button" type="button" data-unavailable>
              Zaboravljena lozinka?
            </button>
          </div>

          <p class="form-message" id="login-message" role="alert" aria-live="assertive" hidden></p>

          <button class="primary" id="login-submit" type="submit">Prijava</button>

    <footer class="ov-footer"><p>Demo: ovako kupac vidi ponudu. Otvaranje ovdje bilježi se kao pregled kupca kako bi se vidio Follow-up Engine na djelu. U demou poveznica radi samo u ovom pregledniku; na BETA serveru kupac je otvara na svom uređaju, bez prijave.</p></footer>`,scripts:[{kind:`module`,src:`viewer/viewer.js`}]}},vu={"login/login.css":`/* Renvara BETA · Prijava — the approved white sign-in design, unchanged in layout. */
:root {
  --red: #c42127;
  --red-text: #a81b20;
  --ink: #14161a;
  --label: #3f4450;
  --muted: #5b616e;
  --field-border: #d5d9e0;
  --field-bg: #f8f9fa;
  --line: #e3e5ea;
  --bg: #ffffff;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--bg);
}

body {
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font-family: inherit;
}

input::placeholder {
  color: #8a909c;
}

.page {
  max-width: 430px;
  min-height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 40px) 24px
    calc(env(safe-area-inset-bottom, 0px) + 28px);
}

/* Brand */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.brand__logo {
  display: block;
  width: auto;
  height: 94px;
  margin: 19px 0 15px;
}

.brand__name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.32em;
  padding-left: 0.32em;
  color: var(--red);
}

/* Sign in */
.signin {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-top: 28px;
}

.intro {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: center;
}

.intro h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.intro p {
  margin: 0;
  font-size: 15px;
  color: var(--muted);
}

.form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.label {
  font-size: 13px;
  font-weight: 700;
  color: var(--label);
}

.input,
.password {
  height: 50px;
  border-radius: 14px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
}

.input {
  width: 100%;
  padding: 0 16px;
  font-size: 16px;
  color: var(--ink);
  outline-color: var(--red);
}

.password {
  display: flex;
  align-items: center;
  padding: 0 4px 0 16px;
}

.password:focus-within {
  outline: 2px solid var(--red);
  outline-offset: 1px;
}

.password__input {
  flex: 1 1 auto;
  min-width: 0;
  height: 44px;
  border: 0;
  background: transparent;
  font-size: 16px;
  color: var(--ink);
  outline: none;
}

.password__toggle {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.password__toggle .icon--hide,
.password__toggle[aria-pressed='true'] .icon--show {
  display: none;
}

.password__toggle[aria-pressed='true'] .icon--hide {
  display: block;
}

[aria-invalid='true'].input,
.password:has([aria-invalid='true']) {
  border-color: var(--red);
}

.forgot {
  display: flex;
  justify-content: flex-end;
  margin-top: -4px;
}

.text-button {
  height: 44px;
  padding: 0 4px;
  border: 0;
  background: transparent;
  color: var(--red-text);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.text-button--inline {
  height: auto;
  min-height: 24px;
  padding: 0;
  font-size: inherit;
}

.form-message {
  margin: -2px 0 0;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--red-text);
  text-align: center;
}

.form-message[data-kind='info'] {
  color: var(--muted);
}

.form-message[hidden] {
  display: none;
}

.primary {
  height: 52px;
  border: 0;
  border-radius: 14px;
  background: var(--red);
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  margin-top: -6px;
  cursor: pointer;
}

.primary:disabled {
  cursor: progress;
  opacity: 0.75;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
}

.divider__line {
  flex: 1 1 auto;
  height: 1px;
  background: var(--line);
}

.divider__text {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.socials {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.social {
  height: 50px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.social--apple {
  border: 0;
  background: var(--ink);
  color: #ffffff;
}

.social--google {
  border: 1px solid var(--field-border);
  background: var(--bg);
  color: var(--ink);
}

.social__icon {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.social__icon--stroke {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
}

.spacer {
  flex: 1 1 auto;
}

.footer {
  margin: 0;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}

.text-button:focus-visible,
.primary:focus-visible,
.social:focus-visible,
.password__toggle:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
}

/* Tablets and computers: the sign-in on a card (phones unchanged). Kept here,
   not in app/css/web.css: /app/* is served only after sign-in. */
@media (min-width: 768px) {
  html,
  body {
    background: #f6f7f8;
  }

  .page {
    max-width: 460px;
    min-height: 0;
    margin: 56px auto;
    padding: 40px 40px 32px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow:
      0 1px 2px rgba(17, 17, 17, 0.04),
      0 12px 32px rgba(17, 17, 17, 0.06);
  }
}

/* "Na Početnu" on the page-not-found screen (login/not-found.html): the button, as a link. */
.primary--link {
  display: grid;
  place-items: center;
  margin-top: 0;
  text-decoration: none;
}
`,"home/styles.css":`/* =============================================================================
   Renvara · Mobile home / dashboard
   Reference-faithful implementation. Light theme only (by specification).
   ========================================================================== */

:root {
  /* Color */
  --bg: #ffffff;
  --text: #111111;
  --text-muted: #737982;
  --red: #e32222;
  --red-text: #c81e1e; /* red on tinted backgrounds, keeps AA contrast */
  --red-soft: #fff1f1;
  --red-tint: #fff7f7;
  --green: #12ae55;
  --green-text: #0a8541; /* green used as text, keeps AA contrast */
  --green-soft: #eaf8ef;
  --gray-dot: #a3a8b0;
  --border: #eceef1;
  --surface-muted: #f6f7f8;
  --divider: #f0f1f3;

  --bar-track: #eef0f2;
  --bar-new: #d3d7dc;
  --bar-progress: #f08585;
  --bar-offer: #f8c0c0;
  --bar-negotiation: #a9dfbb;
  --bar-closing: #12ae55;

  /* Typography */
  --font:
    -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Arial, sans-serif;
  --fs-xs: 0.6875rem; /* 11 */
  --fs-sm: 0.8125rem; /* 13 */
  --fs-md: 0.9375rem; /* 15 */
  --fs-lg: 1.25rem; /* 20 */
  --fs-xl: 1.625rem; /* 26 */

  /* Spacing */
  --page-x: 16px;
  --gap: 12px;
  --gap-sm: 8px;
  --gap-lg: 16px;

  /* Shape & depth */
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(17, 17, 17, 0.04), 0 4px 14px rgba(17, 17, 17, 0.04);
  --shadow-fab: 0 6px 16px rgba(227, 34, 34, 0.35), 0 2px 4px rgba(17, 17, 17, 0.12);
  --shadow-menu: 0 12px 32px rgba(17, 17, 17, 0.14), 0 2px 6px rgba(17, 17, 17, 0.06);

  /* Layout */
  --app-max: 430px;
  --tabbar-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------------------------------------------------------------- base --- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-align: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
  border-radius: 8px;
}

.sprite {
  display: none;
}

.icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon--filled {
  fill: currentColor;
  stroke: none;
}

/* ------------------------------------------------------------- shell --- */
.app {
  position: relative;
  max-width: var(--app-max);
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
}

.content {
  display: flex;
  flex-direction: column;
  gap: var(--gap-lg);
  padding: 4px var(--page-x) calc(var(--tabbar-h) + var(--safe-bottom) + 88px);
}

/* ------------------------------------------------------------ header --- */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) var(--page-x) 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand__logo {
  width: 44px;
  height: auto;
  flex: 0 0 auto;
}

.brand__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.brand__name {
  font-size: var(--fs-xl);
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1.05;
}

.brand__date {
  font-size: var(--fs-sm);
  color: var(--text-muted);
  white-space: nowrap;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface-muted);
}

.account {
  position: relative;
}

.account-menu {
  position: absolute;
  z-index: 35;
  top: calc(100% + 8px);
  right: 0;
  display: flex;
  flex-direction: column;
  min-width: 200px;
  padding: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-menu);
  transform-origin: top right;
  animation: menu-in 0.16s ease-out;
}

.account-menu[hidden] {
  display: none;
}

.account-menu__name {
  margin: 0;
  padding: 8px 12px 6px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-muted);
}

.account-menu button {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-md);
  font-weight: 500;
}

.account-menu button:hover,
.account-menu button:focus-visible {
  background: var(--red-soft);
}

.account-menu .icon {
  color: var(--red);
}

.avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ----------------------------------------------------------- metrics --- */
.metrics {
  display: flex;
  gap: var(--gap-sm);
  margin: 0 calc(var(--page-x) * -1);
  padding: 2px var(--page-x) 6px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scroll-padding-inline: var(--page-x);
  scrollbar-width: none;
}

.metrics::-webkit-scrollbar {
  display: none;
}

.metric {
  position: relative;
  flex: 0 0 106px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 10px 12px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  scroll-snap-align: start;
  transition: transform 0.12s ease;
}

.metric:active {
  transform: scale(0.98);
}

.metric__label {
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.metric__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-height: 32px;
}

.metric__value {
  font-size: 1.375rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
}

.metric__icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  flex: 0 0 auto;
}

.metric__icon .icon {
  width: 17px;
  height: 17px;
}

.metric__icon--red {
  background: var(--red-soft);
  color: var(--red);
}

.metric__icon--green {
  background: var(--green-soft);
  color: var(--green);
}

.metric__icon--plain {
  position: absolute;
  top: 8px;
  right: 6px;
  width: 24px;
  height: 24px;
  color: var(--green);
}

.metric__icon--plain .icon {
  stroke-width: 3;
}

.trend {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--green-text);
}

.trend .icon {
  width: 14px;
  height: 14px;
  stroke-width: 2.4;
}

/* ------------------------------------------------------ module cards --- */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.module__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--red-tint);
  border-bottom: 1px solid var(--divider);
}

/* A long title and link (PRIORITETNI ZADACI · Pogledaj sve zadatke): on a narrow
   phone the link moves under the title instead of overlapping it. */
.module__head--wrap {
  flex-wrap: wrap;
  row-gap: 2px;
}

.module__head--wrap .module__link {
  margin-left: auto;
}

.module__icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: var(--radius-sm);
  background: var(--red-soft);
  color: var(--red);
}

.module__title {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  line-height: 1.1;
}

.module__link {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  flex: 0 0 auto;
  min-height: 32px;
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--red);
  white-space: nowrap;
}

.module__link .icon {
  width: 15px;
  height: 15px;
  stroke-width: 2.2;
}

.list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.list > li + li {
  border-top: 1px solid var(--divider);
}

.chevron {
  width: 18px;
  height: 18px;
  color: #9aa0a8;
}

/* DANAS rows */
.event {
  width: 100%;
  min-height: 60px;
  display: grid;
  grid-template-columns: 48px 10px minmax(0, 1fr) 18px;
  align-items: center;
  column-gap: 12px;
  padding: 10px 14px;
}

.event:active,
.stage:active,
.waiting:active {
  background: var(--surface-muted);
}

.event__time {
  font-size: var(--fs-md);
  font-variant-numeric: tabular-nums;
  color: #3b3f45;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.dot--green {
  background: var(--green);
}

.dot--red {
  background: var(--red);
}

.dot--gray {
  background: var(--gray-dot);
}

.event__text,
.waiting__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.event__title {
  font-size: var(--fs-md);
  font-weight: 600;
  line-height: 1.25;
}

.event__sub {
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

.event__time--all-day {
  font-size: var(--fs-xs);
  line-height: 1.2;
}

/* Completed calendar entry: green check instead of the dot, stays visible as history. */
.event__done {
  width: 18px;
  height: 18px;
  margin-left: -4px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--green);
  color: #ffffff;
}

.event__done .icon {
  width: 12px;
  height: 12px;
  stroke-width: 3.4;
}

.event--done .event__title {
  color: var(--text-muted);
}

.empty-row {
  padding: 16px 14px;
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

/* PRIORITETI rows */
.task {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 8px;
  padding: 6px 14px 6px 8px;
  min-height: 56px;
}

.task__check {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.task__check::before {
  content: '';
  grid-area: 1 / 1;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--red);
  background: var(--bg);
  transition:
    background 0.15s ease,
    border-color 0.15s ease;
}

.task__check .icon {
  grid-area: 1 / 1;
  width: 15px;
  height: 15px;
  stroke-width: 3.2;
  color: #ffffff;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.task__check[aria-pressed='true']::before {
  background: var(--green);
  border-color: var(--green);
}

.task__check[aria-pressed='true'] .icon {
  opacity: 1;
}

.task__title {
  font-size: var(--fs-md);
  line-height: 1.3;
}

.pill {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 500;
  white-space: nowrap;
}

.pill--red {
  background: var(--red-soft);
  color: var(--red-text);
}

.pill--green {
  background: var(--green-soft);
  color: var(--green-text);
}

/* ------------------------------------------------ lower two columns --- */
.split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  align-items: start;
}

.module--compact {
  container-type: inline-size;
}

.module--compact .module__head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 6px;
  padding: 10px 8px 6px 10px;
  background: var(--bg);
  border-bottom: 0;
}

.module--compact .module__icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
}

.module--compact .module__icon .icon {
  width: 17px;
  height: 17px;
}

/* A card title that opens the card's screen (Opportunity Pipeline, Feedback overview). */
.module__title-link {
  color: inherit;
  text-decoration: none;
}

.module--compact .module__title {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.15;
}

.module--compact .module__link {
  font-size: 0.6875rem;
  min-height: 24px;
}

.module--compact .module__link .icon {
  width: 13px;
  height: 13px;
}

@container (max-width: 199px) {
  .module--compact .module__head {
    grid-template-columns: auto minmax(0, 1fr);
    row-gap: 0;
  }

  .module--compact .module__link {
    grid-column: 1 / -1;
    justify-self: end;
    min-height: 20px;
    margin-top: -2px;
  }
}

/* Pipeline: one shared grid so bars line up across rows */
.pipeline {
  display: grid;
  grid-template-columns: max-content minmax(20px, 1fr) 20px;
  margin: 0;
  padding: 0 0 6px;
  list-style: none;
}

.pipeline > li {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
}

.stage {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  align-items: center;
  column-gap: 8px;
  min-height: 36px;
  padding: 0 10px;
}

.stage__label {
  font-size: 0.78rem;
  white-space: nowrap;
}

.stage__track {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--bar-track);
  overflow: hidden;
}

.stage__fill {
  display: block;
  width: var(--fill);
  height: 100%;
  border-radius: inherit;
  background: var(--bar);
}

.stage__count {
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* Čekaš odgovor */
.module--compact .list > li + li {
  border-top: 1px solid var(--divider);
}

.waiting {
  width: 100%;
  min-height: 52px;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto 10px;
  align-items: center;
  column-gap: 5px;
  padding: 8px 6px 8px 8px;
}

.waiting__icon {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: var(--surface-muted);
  color: #8a9099;
}

.waiting__icon .icon {
  width: 15px;
  height: 15px;
}

.waiting__name {
  font-size: 0.78rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.waiting__sub {
  font-size: 0.625rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.waiting__days {
  font-size: 0.6875rem;
  font-weight: 500;
  color: var(--red-text);
  white-space: nowrap;
}

.waiting .chevron {
  width: 10px;
  height: 10px;
}

/* ---------------------------------------------------------- quick add --- */
.quick-add {
  position: fixed;
  z-index: 30;
  right: max(var(--page-x), calc((100vw - var(--app-max)) / 2 + var(--page-x)));
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 14px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.fab {
  width: 60px;
  height: 60px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--red);
  color: #ffffff;
  box-shadow: var(--shadow-fab);
  transition: transform 0.18s ease;
}

.fab .icon {
  width: 28px;
  height: 28px;
  stroke-width: 2.4;
}

.fab[aria-expanded='true'] {
  transform: rotate(45deg);
}

/* The Quick Add sheet itself: .rv-sheet / .rv-quick-add in /app/css/components.css. */

/* ------------------------------------------------------------- tabbar --- */
.tabbar {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(100%, var(--app-max));
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 6px 4px var(--safe-bottom);
  background: var(--bg);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(17, 17, 17, 0.04);
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 48px;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: #7c828b;
}

.tab .icon {
  width: 25px;
  height: 25px;
  stroke-width: 1.8;
}

.tab.is-active {
  color: var(--red);
  font-weight: 600;
}

.tab__label {
  text-align: center;
  line-height: 1.15;
}

/* "Follow-up / Engine": two compact lines, same size as the other labels. */
.tab--two-line {
  gap: 2px;
}

.tab--two-line .icon {
  width: 23px;
  height: 23px;
}

/* -------------------------------------------------------- period bar --- */
.period {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: -6px;
}

.period__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap-sm);
  min-width: 0;
}

.period__trigger {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 40px;
  margin-left: -2px;
  padding: 0 6px 0 2px;
  border-radius: var(--radius-sm);
}

.period__trigger:active {
  background: var(--surface-muted);
}

.period__title {
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: -0.01em;
}

.period__chevron {
  width: 20px;
  height: 20px;
  color: var(--red);
  stroke-width: 2.4;
}

.period__state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: var(--surface-muted);
  color: var(--text-muted);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
}

.period__state .icon {
  width: 13px;
  height: 13px;
}

.period__state--live {
  background: var(--green-soft);
  color: var(--green-text);
}

.period__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.period__row--sub {
  justify-content: flex-start;
  flex-wrap: wrap;
  column-gap: var(--gap);
}

.period__range {
  font-size: var(--fs-sm);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.period__back {
  min-height: 28px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--red);
}

/* ----------------------------------------------- views and loading --- */
.dashboard-view {
  display: flex;
  flex-direction: column;
  gap: var(--gap-lg);
}

.dashboard-view[hidden] {
  display: none;
}

.is-entering {
  animation: view-in 0.22s ease-out;
}

@keyframes view-in {
  from {
    opacity: 0;
  }
}

.skeleton {
  display: block;
  border-radius: 6px;
  background: var(--surface-muted);
  animation: skeleton-pulse 1.1s ease-in-out infinite alternate;
}

.skeleton--label {
  width: 70%;
  height: 10px;
}

.skeleton--value {
  width: 55%;
  height: 22px;
  margin: 5px 0;
}

.metric.is-skeleton {
  pointer-events: none;
}

.skeleton-card {
  background: var(--surface-muted);
  border-color: var(--divider);
  box-shadow: none;
  animation: skeleton-pulse 1.1s ease-in-out infinite alternate;
}

@keyframes skeleton-pulse {
  to {
    opacity: 0.55;
  }
}

.trend--down {
  color: var(--red-text);
}

.trend--none {
  color: var(--text-muted);
}

.pill--muted {
  background: var(--surface-muted);
  color: var(--text-muted);
}

/* -------------------------------------------- historical dashboard --- */
/* Same cards; neutral heads say "a closed period", green says "done". */
.module--history .module__head {
  background: var(--surface-muted);
}

.module--history:not(.module--compact) .module__title {
  font-size: 1.125rem;
}

.module--history.module--compact .module__head {
  background: var(--bg);
}

.hist-summary {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  margin: 0;
  padding: 10px 14px;
  border-bottom: 1px solid var(--divider);
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

.hist-summary__item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}

.hist-summary__item.is-done {
  color: var(--green-text);
}

.hist-summary__item .icon {
  width: 14px;
  height: 14px;
  stroke-width: 3;
}

.event__time {
  font-variant-numeric: tabular-nums;
}

.event--history .event__time {
  font-size: var(--fs-sm);
}

.hist-check,
.hist-open {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
}

.hist-check {
  background: var(--green);
  color: #ffffff;
}

.hist-check .icon {
  width: 13px;
  height: 13px;
  stroke-width: 3.2;
}

.hist-open {
  border: 2px solid #c9ced6;
}

.hist-task {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 12px;
  min-height: 52px;
  padding: 8px 14px;
}

.hist-task__title {
  font-size: var(--fs-md);
  line-height: 1.3;
}

.hist-task:not(.is-done) .hist-task__title {
  color: var(--text-muted);
}

.hist-leads {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px;
}

.hist-big {
  margin: 0;
  font-size: var(--fs-md);
  color: var(--text-muted);
}

.hist-big strong {
  font-size: var(--fs-xl);
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}

.hist-bars {
  display: grid;
  grid-template-columns: max-content minmax(40px, 1fr) 28px;
  row-gap: 8px;
  column-gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.hist-bar {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  align-items: center;
  font-size: var(--fs-sm);
}

.hist-bar__track {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--bar-track);
  overflow: hidden;
}

.hist-bar__fill {
  display: block;
  width: var(--fill);
  height: 100%;
  border-radius: inherit;
}

.hist-bar__fill--red {
  background: var(--bar-progress);
}

.hist-bar__fill--green {
  background: var(--green);
}

.hist-bar__fill--gray {
  background: var(--bar-new);
}

.hist-bar__value {
  text-align: right;

.hist-revenue {

  padding: 12px 14px 14px;

.hist-caption {

.hist-leads__ratios {

  gap: 10px;

  text-align: center;
}

.module-status__icon {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 18px;

  color: var(--red-text);
}

.module-status__icon .icon {
  width: 30px;
  height: 30px;
}

.module-status__title {
  margin: 6px 0 0;
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: 0.06em;
}

.module-status__text {
  margin: 0;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--green-soft);
  color: var(--green-text);
  font-size: var(--fs-md);

}

.module-status__back {

  align-items: center;
  gap: 6px;
  min-height: 40px;
  margin-top: 8px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--red);
  text-decoration: none;
}

/* -------------------------------------------------------------- toast --- */
.toast {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 90px);
  transform: translateX(-50%);
  max-width: calc(min(100vw, var(--app-max)) - 2 * var(--page-x));
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  background: var(--text);
  color: #ffffff;
  font-size: var(--fs-sm);
  font-weight: 500;
  white-space: nowrap;
}

.toast[hidden] {
  display: none;
}

/* ---------------------------------------------------- small screens --- */
@media (max-width: 374px) {
  :root {
    --page-x: 12px;

  .brand__name {
    font-size: 1.375rem;
  }

  .split {

}

@media (prefers-reduced-motion: reduce) {

  *::after {

/* ------------------------------------------- KPI: won / lost / money --- */
.metric--outcome {
  cursor: default;
}

.metric__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-height: 20px;
}

.metric__note {
  font-size: 0.625rem;
  color: var(--text-muted);
  white-space: nowrap;
}

.metric__modes {
  display: inline-flex;
  flex: 0 0 auto;
  padding: 1px;
  border-radius: var(--radius-pill);
  background: var(--surface-muted);
}

.metric__mode {
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 0.6875rem;
  font-weight: 700;
  cursor: pointer;
}

.metric__mode[aria-pressed='true'] {
  background: var(--bg);

}

.metric--money {
  flex-basis: 128px;
  gap: 4px;
}

.metric__pair {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.metric__key {
  font-size: 0.625rem;
  color: var(--text-muted);
}

.metric__amount {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.metric__pair--won .metric__amount {
  color: var(--green-text);
}

/* ---------------------------------- pipeline: four business categories --- */
.pipeline--overview {
  grid-template-columns: minmax(0, 1fr) auto;
}

.stage--metric {
  min-height: 38px;
}

.stage--metric .stage__label {
  overflow: hidden;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-overflow: ellipsis;
  text-transform: uppercase;
}

.stage--metric .stage__count {
  font-size: 0.95rem;
  font-weight: 800;
}

/* --------------------------------------- feedback overview & priority --- */
.waiting--offer .rv-wait {
  min-width: 28px;
  height: 20px;
  padding: 0 6px;

}

.waiting__more {

}

.dot--priority-high {
  background: var(--rv-priority-high);
}

.pill--priority-high {
  background: var(--rv-priority-high);
  color: #ffffff;
}

/* LOST: fewer is better, so a rise reads red and a fall green. */
.trend--worse {
  color: var(--red-text);
}

.trend--better {
  color: var(--green-text);
}

:root {

  --rv-muted: #737982;
  --rv-border: #eceef1;
  --rv-divider: #f0f1f3;
  --rv-field-border: #d5d9e0;

  --rv-shadow-drawer: -18px 0 48px rgba(17, 17, 17, 0.16);

  --rv-signal-yellow: #f5c518;

  --rv-signal-red: #e32222;
  --rv-signal-black: #111111;
  --rv-priority-low: var(--rv-signal-yellow);
  --rv-priority-low-ink: var(--rv-signal-yellow-ink);
  --rv-priority-medium: var(--rv-signal-red);
  --rv-priority-high: var(--rv-signal-black);
}

html.rv-scroll-lock {
  overflow: hidden;
}

/* ------------------------------------------------------------- icons --- */
.rv-icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.rv-icon--sm {
  width: 15px;
  height: 15px;
}

/* ----------------------------------------------------------- buttons --- */
.rv-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: var(--rv-radius-field);
  font-family: var(--rv-font);
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition:
    transform 0.12s ease,
    background-color 0.15s ease,
    border-color 0.15s ease;
}

.rv-btn:active {
  transform: scale(0.98);
}

.rv-btn:disabled {
  opacity: 0.6;
  cursor: progress;
}

.rv-btn:focus-visible,
.rv-icon-btn:focus-visible,
.rv-link-btn:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: 2px;
}

.rv-btn .rv-icon {
  width: 18px;
  height: 18px;
}

.rv-btn--primary {
  background: var(--rv-red);
  color: #ffffff;
}

.rv-btn--primary:hover {

}

.rv-btn--dark {

.rv-btn--dark:hover {

.rv-btn--secondary {

}

.rv-btn--lg {

.rv-icon-btn {

.rv-icon-btn:hover {

  min-height: 24px;
  padding: 0 10px;

/* ------------------------------------------------------------ drawer --- */
.rv-drawer-root {

.rv-form {

}

/* ------------------------------------------------------------- toast --- */

  letter-spacing: 0.03em;
}

/* Several choices (PRILIKA JE OSVOJENA!): one per row, full width. */
.rv-confirm__actions--stack {
  flex-direction: column;
}

.rv-confirm__actions--stack .rv-btn {
  flex: none;
  width: 100%;
}

@keyframes rv-sheet-in {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
}

@media (min-width: 600px) {

@media (prefers-reduced-motion: reduce) {

}

.rv-icon--xs {

}

.rv-badge .rv-icon--xs {

}

/* ------------------------------------------------------- bottom sheet --- */

.rv-sheet-root {

  display: flex;
  align-items: flex-end;
  justify-content: center;
  font-family: var(--rv-font);
  color: var(--rv-ink);
}

.rv-sheet-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(17, 17, 17, 0.36);
  opacity: 0;

.rv-sheet {

  transform: translateY(100%);
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
  touch-action: none;
}

.rv-sheet.is-dragging {
  transition: none;
}

.rv-sheet-root.is-open .rv-sheet-backdrop {
  opacity: 1;
}

.rv-sheet-root.is-open .rv-sheet {
  transform: translateY(0);
}

.rv-sheet__handle {
  width: 40px;
  height: 5px;
  margin: 2px auto 10px;
  border-radius: 999px;
  background: #d5d9e0;
}

.rv-sheet__title {
  margin: 0 4px 12px;
  font-size: 17px;
  font-weight: 800;
}

.rv-sheet__body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 0;
}

.rv-sheet__scroll {
  min-height: 0;
  max-height: 55vh;
  overflow-y: auto;
  overscroll-behavior: contain;
  touch-action: pan-y;
}

.rv-sheet__list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.rv-sheet__list li + li {
  border-top: 1px solid var(--rv-divider);
}

.rv-sheet__option {
  display: flex;
  flex-direction: column;
  gap: 2px;
  width: 100%;
  min-height: 56px;
  padding: 10px 6px;
  border: 0;
  background: transparent;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.rv-sheet__option strong {
  font-size: 15px;
}

.rv-sheet__option span {
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-sheet__option.is-selected strong {
  color: var(--rv-red-text);
}

.rv-sheet__empty {
  padding: 16px 6px;
  color: var(--rv-muted);
  font-size: 14px;
}

.rv-sheet--picker .rv-input {
  min-height: 48px;
  font-size: 16px;
}

/* Quick Add: five large rows. */
.rv-quick-add {
  margin: 0;
  padding: 0;
  list-style: none;
}

.rv-quick-add__item {
  display: flex;
  align-items: center;
  gap: 14px;
  min-height: 60px;
  padding: 6px 6px;
  border-radius: 14px;
  color: inherit;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

.rv-quick-add__item:active,
.rv-quick-add__item:focus-visible {
  background: var(--rv-red-soft);
  outline: none;
}

.rv-quick-add__icon {

  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--rv-red-soft);
  color: var(--rv-red);
}

.rv-quick-add__label {
  flex: 1 1 auto;
}

.rv-quick-add__chevron {
  color: #9aa0a8;
}

@media (min-width: 600px) {
  .rv-sheet-root {
    align-items: center;
  }

  .rv-sheet {
    border-radius: 20px;
    padding-bottom: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  .rv-sheet,
  .rv-sheet-backdrop {
    transition: none;
  }
}

/* ------------------------------------------------------------ switch --- */
.rv-switch {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 48px;
  padding: 4px 0;
  cursor: pointer;
}

.rv-switch__text {
  font-size: 15px;
  font-weight: 600;
}

.rv-switch__input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.rv-switch__track {
  position: relative;
  flex: 0 0 auto;
  width: 51px;
  height: 31px;
  border-radius: 999px;
  background: #d5d9e0;
  transition: background 0.18s ease;
}

.rv-switch__track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 2px 4px rgba(17, 17, 17, 0.2);
  transition: transform 0.18s ease;
}

.rv-switch__input:checked + .rv-switch__track {
  background: var(--rv-green);
}

.rv-switch__input:checked + .rv-switch__track::after {
  transform: translateX(20px);
}

.rv-switch__input:focus-visible + .rv-switch__track {
  outline: 2px solid var(--rv-red);
  outline-offset: 2px;
}

.rv-field[hidden] {
  display: none;
}

/* ------------------------------------------------------------ picker --- */
.rv-picker {
  position: relative;
  display: flex;
  align-items: center;
}

.rv-picker__trigger {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  cursor: pointer;
}

.rv-picker__text {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-width: 0;
}

.rv-picker__label {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}

.rv-picker__trigger.is-empty .rv-picker__label {
  color: var(--rv-muted);
  font-weight: 400;
}

.rv-picker__sub {
  color: var(--rv-muted);
  font-size: 12.5px;
}

.rv-picker__sub[hidden] {
  display: none;
}

.rv-picker__icon {
  color: var(--rv-red);
}

.rv-picker__chevron {
  color: #9aa0a8;
}

.rv-picker__clear {
  position: absolute;
  right: 36px;
}

.rv-picker__clear[hidden] {
  display: none;
}

.rv-picker:has(.rv-picker__clear:not([hidden])) .rv-picker__trigger {
  padding-right: 80px;
}

.rv-field--invalid .rv-picker__trigger {
  border-color: var(--rv-red);

/* The compact period control ("Q4 2026 ▾") of a page's action area, its caption

.rv-period-slot {
  display: flex;
  min-width: 0;
}

.rv-period-btn {

  padding: 0 12px;

}

.rv-period-btn .rv-icon {

}

.rv-period-btn .rv-period-btn__chevron {

  stroke-width: 2.4;
}

.rv-period-btn__label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  font-variant-numeric: tabular-nums;
}

.rv-period-btn.is-history {
  background: var(--rv-surface-muted);
}

.rv-period-caption {
  margin: -8px 2px 14px;
  color: var(--rv-muted);
  font-size: 13px;
}

/* A new period is loading: the previous records are dimmed and not clickable. */
.rv-period-body {

}

.rv-period-body.is-loading {
  opacity: 0.45;
  pointer-events: none;
}

/* ------------------------------------------------------ period sheet --- */
.period-sheet__years {

  align-items: center;
  justify-content: space-between;
  padding: 0 2px;
}

.period-sheet__year {
  font-size: 15px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.period-sheet__years .rv-icon-btn:disabled {
  opacity: 0.3;
}

.period-option {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 56px;
  padding: 8px 6px;
  border: 0;
  border-radius: 12px;
  background: transparent;
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.period-option:active,
.period-option:focus-visible {
  background: var(--rv-surface-muted);
  outline: none;
}

.period-option__check {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  color: var(--rv-red);
}

.period-option__check .rv-icon {
  stroke-width: 2.6;
}

.period-option__text {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

.period-option__text strong {
  font-size: 16px;
}

.period-option__text span {
  color: var(--rv-muted);

}

.period-option.is-selected .period-option__text strong {

}

.period-option__note {

}

.period-option--custom {

}

.period-sheet__current {

  border: 1px solid var(--rv-border);
  border-radius: 999px;
  background: var(--rv-bg);
  color: var(--rv-red-text);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.period-range .rv-input {
  min-height: 48px;
  font-size: 16px;
}

.period-range .rv-field + .rv-field {
  margin-top: 4px;
}

.period-range .rv-confirm__actions .rv-btn:disabled {
  opacity: 0.45;
}

/* ------------------------------------------------- signals & priority --- */
/* Feedback Overview: days an offer has been waiting ("5D"). Text + colour. */
.rv-wait {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  height: 22px;
  padding: 0 7px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.rv-wait--yellow {
  background: var(--rv-signal-yellow);
  color: var(--rv-signal-yellow-ink);
}

.rv-wait--red {
  background: var(--rv-signal-red);
  color: #ffffff;
}

.rv-wait--black {
  background: var(--rv-signal-black);
  color: #ffffff;
}

/* Task priority badge: LOW yellow, MEDIUM red, HIGH black (always with its label). */
.rv-priority--low {
  background: var(--rv-priority-low);
  color: var(--rv-priority-low-ink);
}

.rv-priority--medium {
  background: var(--rv-priority-medium);
  color: #ffffff;
}

.rv-priority--high {
  background: var(--rv-priority-high);
  color: #ffffff;
}

/* ----------------------------------------------------- sheet forms --- */
.rv-sheet--form .rv-input {
  min-height: 48px;
  font-size: 16px;
}

.rv-sheet__actions {
  display: flex;
  gap: 10px;
  padding-top: 4px;
}

.rv-sheet__actions > .rv-btn[hidden] {
  display: none;
}

.rv-sheet__actions .rv-btn {
  min-height: 50px;
  border-radius: 14px;
}

.rv-sheet__actions .rv-btn--secondary {
  flex: 1 1 0;
}

.rv-sheet__actions .rv-btn--primary {
  flex: 2 1 0;
}

/* ------------------------------------------------------- reminders --- */
.rv-reminder__presets {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.rv-reminder__note {
  display: flex;

.rv-push__result {

}

.rv-push__result {
  color: var(--rv-ink);
}

.rv-push__status {

  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
}

.rv-reminder__note[hidden] {
  display: none;
}

  padding: 12px 14px 12px 20px;
  border: 0;
  background: none;
  color: var(--rv-ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.rv-accordion__toggle:hover {
  background: var(--rv-surface-muted);
}

.rv-accordion__toggle:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: -2px;
  border-radius: var(--rv-radius);
}

.rv-accordion__toggle .rv-section__title {
  min-width: 0;
  overflow-wrap: anywhere;
}

.rv-accordion__chevron {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  margin-left: auto;
  border-radius: 10px;
  background: var(--rv-surface-muted);
  color: var(--rv-red);
}

.rv-accordion__chevron .rv-icon {
  stroke-width: 2.4;
  transition: transform 0.24s ease;
}

.rv-accordion.is-open .rv-accordion__chevron .rv-icon {
  transform: rotate(180deg); /* chevron up */
}

/* Height animation without measuring: 0fr → 1fr. */
.rv-accordion__panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.24s ease;
}

.rv-accordion.is-open .rv-accordion__panel {
  grid-template-rows: 1fr;
}

.rv-accordion__inner {
  min-height: 0;
  overflow: hidden;
}

.rv-accordion__content {
  padding: 4px 20px 20px;
}

.rv-accordion__content > .rv-empty {
  padding: 8px 0 0;
}

@media (prefers-reduced-motion: reduce) {
  .rv-accordion__panel,
  .rv-accordion__chevron .rv-icon {
    transition: none;
  }
}

.rv-section__summary {
  margin: -4px 0 12px;
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-subtitle {
  margin: 16px 0 8px;
  color: var(--rv-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

  flex-direction: column;
  margin: 0;
}

.rv-dl__row {

  gap: 12px;
  padding: 9px 0;
  border-top: 1px solid var(--rv-divider);
  font-size: 14px;
}

.rv-dl__row:first-child {
  border-top: 0;
}

.rv-dl__row dt {
  color: var(--rv-muted);
}

.rv-dl__row dd {
  margin: 0;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.rv-upcoming__item {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--rv-divider);
}

.rv-upcoming__icon {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 10px;
  background: var(--rv-green-soft);
  color: var(--rv-green-text);
}

.rv-upcoming__icon .rv-icon {
  width: 17px;
  height: 17px;
}

.rv-upcoming__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: 14px;
}

.rv-upcoming__text span {
  color: var(--rv-muted);

}

/* opportunities */

.rv-contacts,

.rv-opp__meta {

.rv-offers {

  padding: 0;

}

.rv-offer {

  flex-wrap: wrap;
  align-items: center;

}

.rv-offer > .rv-icon {
  color: var(--rv-red);
}

.rv-offer__text {
  display: flex;
  flex: 1 1 160px;
  flex-direction: column;
  min-width: 0;
}

.rv-offer__link {
  font-size: 13px;
  font-weight: 600;
  color: var(--rv-red-text);
  text-decoration: none;
}

.rv-offer__link strong {

.rv-offer__link:hover strong {

}

.rv-offer__text span {
  color: var(--rv-muted);
}

.rv-opp__origin {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 0;
  color: var(--rv-text-2);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}

.rv-opp__origin:hover {
  color: var(--rv-red-text);
}

.rv-opp__reminder {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 0;
  color: var(--rv-text-2);
  font-size: 13px;
}

.rv-opp__reminder.is-failed {
  color: var(--rv-red-text);
}

.rv-opp__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;

.rv-timeline__item {

  display: flex;
  gap: 14px;

}

.rv-timeline__item:not(:last-child)::before {

  left: 17px;
  width: 2px;

}

  height: 36px;

  place-items: center;

  border-radius: 50%;
}

.rv-timeline__icon .rv-icon {
  width: 17px;
  height: 17px;

.rv-timeline__icon--red {
  background: var(--rv-red-soft);
  color: var(--rv-red);
}

.rv-timeline__icon--green {
  background: var(--rv-green-soft);
  color: var(--rv-green-text);
}

.rv-timeline__icon--neutral {
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
}

.rv-timeline__body {

  flex-direction: column;
  gap: 3px;
  min-width: 0;
  padding-top: 2px;
}

  font-size: 15px;
  font-weight: 700;
}

}

}

  padding: 4px 0;

}

.rv-tasks .rv-task:first-child {
  border-top: 0;
}

.rv-task__check {

  height: 44px;

  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;

}

.rv-task__check::before {

  height: 14px;
  stroke-width: 3.2;
  color: #ffffff;
  opacity: 0;
}

.rv-task__check[aria-pressed='true']::before {

}

.rv-task__check:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: -2px;
}

.rv-task__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.rv-task__title {
  font-size: 14.5px;
  font-weight: 600;
}

.rv-task.is-done .rv-task__title {
  color: var(--rv-muted);

.rv-task__meta {
  color: var(--rv-muted);
  font-size: 12.5px;

}

.rv-contact:first-child {
  border-top: 0;
  padding-top: 2px;
}

  height: 40px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;

  color: var(--rv-text-2);
  font-size: 14px;

}

  min-width: 0;
  font-size: 14px;
}

.rv-contact__role {

  font-size: 13px;
}

.rv-contact__channels {

  flex-wrap: wrap;
  gap: 4px 14px;
  color: var(--rv-text-2);

.rv-pipeline-empty {

.rv-agenda {

.rv-agenda__day {

.rv-agenda__list li + li {

  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rv-border);
}

.rv-screen__header-inner {
  display: flex;
  align-items: center;
  gap: 4px;
  max-width: 560px;
  min-height: 56px;
  margin: 0 auto;
  padding: 0 8px;
}

.rv-screen__back {
  color: var(--rv-ink);
}

.rv-screen__back .rv-icon {
  width: 26px;
  height: 26px;
}

.rv-screen__back:disabled {
  opacity: 0.4;
}

.rv-screen__title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.rv-screen__title:focus {
  outline: none;
}

.rv-screen__body {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
}

/* Mobile-sized controls: 16px text avoids iOS zoom-on-focus; ≥48px touch height. */
.rv-screen .rv-form {
  gap: 28px;
}

.rv-screen .rv-form__section-title {
  font-size: 12px;
}

.rv-screen .rv-field__label {
  font-size: 14px;
}

.rv-screen .rv-input {
  min-height: 48px;
  font-size: 16px;
}

.rv-screen .rv-field {
  scroll-margin: 88px 0 120px;
}

.rv-screen__error {
  margin: 20px 0 0;
  padding: 12px 14px;
  border-radius: var(--rv-radius-field);
  background: var(--rv-red-soft);
  color: var(--rv-red-text);
  font-size: 14px;
  font-weight: 600;
}

.rv-screen__error[hidden] {
  display: none;
}

.rv-screen__actions {
  display: flex;
  gap: 10px;
  margin-top: 28px;
}

.rv-screen__actions .rv-btn {
  min-height: 52px;
  border-radius: 14px;
  font-size: 15px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.rv-screen__actions .rv-btn--secondary {
  flex: 1 1 0;
}

.rv-screen__actions .rv-btn--primary {
  flex: 2 1 0;
}

@media (prefers-reduced-motion: reduce) {
  .rv-screen {
    animation: none;
  }
}

.rv-screen__loading {
  color: var(--rv-muted);
}

/* Time pickers side by side on the task screen. */
.rv-screen .rv-form__grid:has(> [data-field='startTime']) {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.rv-screen .rv-form__grid:has(> [data-field='startTime']) > :not([data-field$='Time']) {
  grid-column: 1 / -1;
}

/* Task detail */
.rv-task-detail {
  padding: 18px 18px 8px;
}

.rv-task-detail__badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.rv-task-detail__title {
  margin: 12px 0 8px;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.rv-task-detail .rv-dl a {
  color: var(--rv-red-text);
  font-weight: 600;
}

.rv-screen__actions--stack {
  flex-direction: column;
}

.rv-screen__actions--stack .rv-btn {
  width: 100%;
}
`,"app/css/leads.css":`/* Renvara · Leads list (/leads), Lead detail (/leads/{id}) and conversion

.lead-row {

}

.lead-row[data-status='won'] .lead-row__avatar {

.lead-row[data-status='lost'] .lead-row__avatar {

.lead-row__text,
.lead-row__side {

.lead-row__company {

.lead-row__value {

.lead-row .rv-badge {

.lead-detail__company {

.lead-detail__stage {

.lead-detail__stage .rv-segmented__option span {

.lead-detail .rv-dl a {

.lead-outcome {

.lead-outcome--won {

}

.lead-outcome--lost {

.lead-outcome__title {

.lead-outcome--won .lead-outcome__title {

.lead-outcome .rv-dl__row {

.lead-section {

.lead-section__count {

.lead-section__empty {

/* Lost sheet */

.lead-reasons {

.rv-sheet--lead-lost .rv-input {

.lead-sheet__actions {

.lead-sheet__actions .rv-btn {

.lead-sheet__actions .rv-btn--secondary {

.lead-sheet__actions .rv-btn--primary {

.lead-matches {

.lead-matches[hidden] {

.lead-matches__title {

.lead-matches__item:first-child {

}

.lead-matches__text {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;

.lead-matches__text span {

/* WON, not yet a customer (ADR-0009): the conversion waits on the lead. */
.lead-convert-pending {

.lead-convert-pending__text {

.lead-convert-pending .rv-btn {

  border-radius: 14px;

.lead-pending {

/* The lead's deals: the same cards as on the customer profile. */
.lead-section .rv-opps {

.lead-row__pending {
