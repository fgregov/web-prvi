`,"app/css/follow-up.css":`/* Follow-up Engine (ADR-0008): overview (/follow-up), document picker
   (/follow-up/new), offer detail (/follow-up/{id}) and the salesperson's
   preview. Renvara tokens from components.css; colour is never the only signal. */

/* ------------------------------------------------------------ overview --- */
.fu-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 4px;
}

.fu-title {
  margin: 0;
  font-size: 1.625rem;
  font-weight: 800;
  letter-spacing: 0.01em;
  line-height: 1.1;
  text-transform: uppercase;
}

.fu-sub {
  margin: 0;
  color: var(--rv-muted);
  font-size: 0.875rem;
  line-height: 1.4;
}

.fu-cta {
  margin-top: 10px;
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  text-decoration: none;
}

/* [ Q4 2026 ▾ ] [ + ATTACH NEW DOCUMENT ]: side by side where both fit with their
   full labels; otherwise (phones: the button needs ~260px) the period sits right
   above the button, which keeps its full width, label and size. Never clipped. */
.fu-head__actions {
  display: flex;
  flex-wrap: wrap;
  align-items: stretch;
  gap: 10px 8px;
  margin-top: 10px;
}

.fu-head__actions .rv-period-slot {
  flex: none;
}

.fu-head__actions .fu-cta {
  flex: 1 0 auto;
  width: auto;
  margin-top: 0;
}

.fu-head .fu-period-caption {
  margin: 2px 2px 0;
}

.fu-filters {
  padding: 12px 12px 4px;
}

/* Four options on a phone: two rows of two below 400px, one row above. */
.fu-filters .rv-segmented {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (min-width: 400px) {
  .fu-filters .rv-segmented {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

.fu-filters .rv-segmented__option span {
  gap: 5px;
  padding: 0 6px;
  font-size: 13px;
  text-align: center;
  line-height: 1.15;
}

.fu-filters__count {
  min-width: 18px;
  padding: 1px 5px;
  border-radius: 999px;
  background: var(--rv-divider);
  color: var(--rv-text-2);
  font-size: 11px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.fu-filters__count:empty {
  display: none;
}

.fu-list-box[aria-busy='true'] {
  opacity: 0.6;
}

.fu-list {
  margin: 0;
  padding: 4px 0;
  list-style: none;
}

.fu-list > li + li {
  border-top: 1px solid var(--rv-divider);
}

.fu-offer {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 18px;
  align-items: center;
  gap: 10px;
  min-height: 64px;
  padding: 12px 10px 12px 14px;
  color: inherit;
  text-decoration: none;
}

.fu-offer:hover {
  background: var(--rv-red-tint);
}

.fu-offer:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: -2px;
}

.fu-offer__main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.fu-offer__customer {
  font-size: 15px;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.fu-offer__title {
  font-size: 14px;
  font-weight: 600;
  color: var(--rv-text-2);
  overflow-wrap: anywhere;
}

.fu-offer__meta,
.fu-offer__views,
.fu-offer__link {
  font-size: 12.5px;
  color: var(--rv-muted);
  overflow-wrap: anywhere;
}

.fu-offer__views.is-viewed {
  color: var(--rv-green-text);
  font-weight: 600;
}

.fu-offer__wait {
  font-size: 12.5px;
  font-weight: 700;
  color: var(--rv-ink);
}

.fu-offer__link {
  color: var(--rv-red-text);
  font-weight: 600;
}

.fu-offer__side {
  display: flex;
  align-items: center;
}

.fu-offer__side .rv-badge {
  white-space: nowrap;
}

.fu-offer__chevron {
  width: 18px;
  height: 18px;
  color: var(--rv-muted);
}

.fu-offer--answered .fu-offer__customer,
.fu-offer--withdrawn .fu-offer__customer,
.fu-offer--closed .fu-offer__customer {
  color: var(--rv-text-2);
}

.fu-empty {
  margin: 0;
}

/* ------------------------------------------------- document picker --- */
.fu-file {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.fu-file__input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.fu-file__drop {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 132px;
  padding: 18px 16px;
  border: 1.5px dashed var(--rv-field-border);
  border-radius: 14px;
  background: var(--rv-field-bg);
  color: var(--rv-text-2);
  font: inherit;
  text-align: center;
  cursor: pointer;
}

.fu-file__drop:hover,
.fu-file.is-dragging .fu-file__drop {
  border-color: var(--rv-red);
  background: var(--rv-red-tint);
}

.fu-file__input:focus-visible + .fu-file__drop,
.fu-file__input:focus-visible ~ .fu-file__card .fu-file__replace {
  outline: 2px solid var(--rv-red);
  outline-offset: 2px;
}

.fu-file__replace {
  cursor: pointer;
}

.rv-field--invalid .fu-file__drop {
  border-color: var(--rv-red);
}

.fu-file__drop .rv-icon {
  width: 26px;
  height: 26px;
  color: var(--rv-red);
}

.fu-file__drop strong {
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.fu-file__drop small {
  color: var(--rv-muted);
  font-size: 13px;
}

.fu-file__card {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr);
  align-items: start;
  gap: 12px;
  padding: 14px;
  border: 1px solid var(--rv-border);
  border-radius: 14px;
  background: var(--rv-bg);
}

.fu-file__icon {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--rv-red-soft);
  color: var(--rv-red);
}

.fu-file__name {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
  overflow-wrap: anywhere;
}

.fu-file__meta {
  margin: 2px 0 0;
  color: var(--rv-muted);
  font-size: 13px;
}

.fu-file__state {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 0;
  font-size: 13px;
  font-weight: 600;
}

.fu-file__state .rv-icon {
  width: 16px;
  height: 16px;
}

.fu-file__state.is-done {
  color: var(--rv-green-text);
}

.fu-file__state.is-failed {
  color: var(--rv-red-text);
}

.fu-file__progress {
  width: 100%;
  height: 6px;
  margin-top: 8px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--rv-divider);
}

.fu-file__bar {
  height: 100%;
  width: 0;
  border-radius: inherit;
  background: var(--rv-red);
  transition: width 0.2s ease;
}

.fu-file__actions {
  grid-column: 2;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

/* --------------------------------------------------------- offer detail --- */
.fu-detail {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.fu-success {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 16px 18px;
  border: 1px solid #bfe8cf;
  border-radius: var(--rv-radius);
  background: var(--rv-green-soft);
}

.fu-success__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--rv-green-text);
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.fu-success__title:focus {
  outline: none; /* focused for screen readers on arrival, not by the user */
}

.fu-success p {
  margin: 0;
  font-size: 14px;
  color: var(--rv-text-2);
}

.fu-card {
  padding: 16px 18px;
}

.fu-card__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--rv-text-2);
}

.fu-card__title .rv-icon {
  width: 16px;
  height: 16px;
  color: var(--rv-red);
}

.fu-summary__customer {
  margin: 0;
  font-size: 13px;
  font-weight: 700;
  color: var(--rv-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.fu-summary__title {
  margin: 4px 0 10px;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.fu-badges {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.fu-detail .rv-dl a {
  color: var(--rv-red-text);
  font-weight: 600;
}

.fu-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}

.fu-actions .rv-btn {
  width: 100%;
  min-height: 48px;
  border-radius: 14px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  text-decoration: none;
}

.fu-actions--row {
  flex-direction: row;
  flex-wrap: wrap;
}

.fu-actions--row .rv-btn {
  flex: 1 1 140px;
  width: auto;
}

.fu-link {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 12px;
  border: 1px solid var(--rv-field-border);
  border-radius: var(--rv-radius-field);
  background: var(--rv-field-bg);
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 13px;
  line-height: 1.35;
  word-break: break-all;
  user-select: all;
  -webkit-user-select: all;
}

a.fu-link {
  color: var(--rv-red-text);
  text-decoration: none;
}

.fu-link .rv-icon {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  color: var(--rv-muted);
}

.fu-link--off {
  color: var(--rv-muted);
  font-family: var(--rv-font);
  font-size: 14px;
  user-select: auto;
  -webkit-user-select: auto;
}

.fu-note {
  margin: 10px 0 0;
  color: var(--rv-muted);
  font-size: 12.5px;
  line-height: 1.45;
}

.fu-stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin: 0;
}

.fu-stat {
  display: flex;
  flex-direction: column-reverse;
  justify-content: flex-end;
  gap: 2px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--rv-surface-muted);
}

.fu-stat dt {
  color: var(--rv-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.fu-stat dd {
  margin: 0;
  font-size: 20px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}

.fu-stat--wide {
  grid-column: 1 / -1;
}

.fu-stat--wide dd {
  font-size: 15px;
}

.fu-history {
  margin: 0;
  padding: 0;
  list-style: none;
}

.fu-history li {
  display: grid;
  grid-template-columns: 20px minmax(0, 1fr);
  gap: 10px;
  padding: 9px 0;
  border-top: 1px solid var(--rv-divider);
  font-size: 14px;
}

.fu-history li:first-child {
  border-top: 0;
}

.fu-history .rv-icon {
  width: 18px;
  height: 18px;
  margin-top: 1px;
  color: var(--rv-muted);
}

.fu-history .is-view .rv-icon {
  color: var(--rv-green-text);
}

.fu-history .is-bot {
  color: var(--rv-muted);
}

.fu-history strong {
  display: block;
  font-weight: 700;
}

.fu-history small {
  display: block;
  color: var(--rv-muted);
  font-size: 12.5px;
}

.fu-internal {
  margin: 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 14px;
}

/* Sheet: "Označi kao poslano" with an earlier date and time. */
.fu-sent-sheet {
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 0 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
}

.fu-sent-sheet__when {
  display: grid;
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  gap: 10px;
}

.fu-sent-sheet .rv-btn {
  width: 100%;
  min-height: 50px;
  border-radius: 14px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

/* ---------------------------------------------------------- preview --- */
.fu-preview__bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 12px;
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
  font-size: 13px;
}

.fu-preview__bar .rv-icon {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
}

.fu-pages {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.fu-pages .pdf-page {
  display: block;
  width: 100%;
  height: auto;
  background: #ffffff;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(17, 17, 17, 0.12);
}

.rv-screen__body--wide {
  max-width: 880px;
}

/* The hidden attribute wins over the display rules above. */
.fu-file [hidden],
.fu-detail [hidden],
.fu-sent-sheet [hidden] {
  display: none !important;
}
`,"app/css/notifications.css":`/* Postavke → MOBILNE OBAVIJESTI (/settings): the user's switches per event type and
   whether this device receives push. Renvara tokens from components.css; the
   head mirrors the Follow-up Engine's; colour is never the only signal. */

.nt-head {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 4px;
  margin-bottom: 14px;
}

.nt-title {
  margin: 0;
  font-size: 1.25rem;
  font-weight: 800;
  letter-spacing: 0.01em;
  line-height: 1.1;
  text-transform: uppercase;
}

.nt-sub {
  margin: 0;
  color: var(--rv-muted);
  font-size: 0.875rem;
  line-height: 1.4;
}

/* Whether push reaches this device. */
.nt-device {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: var(--rv-radius-sm);
  background: var(--rv-surface-muted);
  font-size: 13px;
  line-height: 1.4;
}

.nt-device:empty {
  display: none;
}

.nt-device .rv-icon {
  flex: none;
  margin-top: 1px;
  color: var(--rv-green);
}

.nt-device.is-warning {
  background: #fff7e6;
}

.nt-device.is-warning .rv-icon {
  color: #b26b00;
}

.nt-device__action {
  align-self: flex-start;
  margin-top: 4px;
}

/* The seven switches. */
.nt-list {
  margin: 0;
  padding: 0 14px 6px;
  list-style: none;
}

.nt-list > li + li {
  border-top: 1px solid var(--rv-border);
}

.nt-row {
  -webkit-tap-highlight-color: transparent;
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
}

.nt-row__icon {
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: var(--rv-surface-muted);
  color: var(--rv-muted);
}

.nt-row__band {
  justify-self: start;
  font-size: 11px;
}

.nt-row__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.nt-row__label {
  font-size: 15px;
  line-height: 1.25;
}

.nt-row__desc {
  color: var(--rv-muted);
  font-size: 13px;
  line-height: 1.35;
}

.nt-row__status {
  min-height: 0;
  color: var(--rv-green);
  font-size: 12px;
  font-weight: 600;
}

.nt-row__status:empty {
  display: none;
}

.nt-row__status.is-error {
  color: var(--rv-red);
}

/* The time for date-only deadlines. */
.nt-time {
  margin-top: 14px;
}

.nt-time__body {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 4px 14px 16px;
}

.nt-time__text {
  margin: 0 0 4px;
  color: var(--rv-muted);
  font-size: 13px;
  line-height: 1.4;
}

.nt-time__input {
  max-width: 160px;
}

.nt-loading,
.nt-error {
  padding: 16px;
  color: var(--rv-muted);
}

.nt-error {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
}

.nt-device__action[hidden] {
  display: none;
}
`,"viewer/viewer.css":`/* Customer offer viewer: the Renvara look (white, red accent), system fonts only
   (no third-party requests from a page that carries a secret link). */
:root {
  --ov-red: #e32222;
  --ov-red-text: #c81e1e;
  --ov-ink: #111111;
  --ov-muted: #5f6670;
  --ov-border: #eceef1;
  --ov-bg: #f6f7f8;
  color-scheme: light;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--ov-bg);
  color: var(--ov-ink);
  font:
    15px/1.45 -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    Roboto,
    Arial,
    sans-serif;
  -webkit-text-size-adjust: 100%;
}

.ov-header {
  position: sticky;
  top: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
  background: #ffffff;
  border-bottom: 1px solid var(--ov-border);
}

.ov-header__brand {
  font-weight: 800;
  letter-spacing: 0.02em;
}

.ov-main {
  max-width: 880px;
  margin: 0 auto;
  padding: 16px 16px 24px;
}

.ov-card {
  background: #ffffff;
  border: 1px solid var(--ov-border);
  border-radius: 16px;
  box-shadow:
    0 1px 2px rgba(17, 17, 17, 0.04),
    0 4px 14px rgba(17, 17, 17, 0.04);
  padding: 18px;
}

.ov-eyebrow {
  margin: 0 0 4px;
  color: var(--ov-red-text);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
}

.ov-title,
.ov-message h1 {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.01em;
  overflow-wrap: anywhere;
}

.ov-meta,
.ov-message p {
  margin: 6px 0 0;
  color: var(--ov-muted);
  font-size: 14px;
}

.ov-download {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  margin-top: 14px;
  padding: 0 18px;
  border-radius: 12px;
  background: var(--ov-red);
  color: #ffffff;
  font-weight: 700;
  text-decoration: none;
}

.ov-download:focus-visible {
  outline: 2px solid var(--ov-red);
  outline-offset: 2px;
}

.ov-status {
  margin: 16px 2px;
  color: var(--ov-muted);
}

.ov-pages {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 16px;
}

.pdf-page {
  display: block;
  width: 100%;
  height: auto;
  background: #ffffff;
  border-radius: 6px;
  box-shadow: 0 1px 4px rgba(17, 17, 17, 0.12);
}

.ov-footer {
  max-width: 880px;
  margin: 0 auto;
  padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 24px);
  color: var(--ov-muted);
  font-size: 12px;
}

.ov-footer p {
  margin: 0;
}
`,"app/css/users.css":`/* Renvara · KORISNICI (users.html, user-new.html, user.html): control bar,
   table with one selectable row, rights accordions, password section. */

/* ------------------------------------------------------- control bar --- */
.rv-users__bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px 16px;
  margin-bottom: 10px;
}

.rv-users__filters {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 12px;
  flex: 1 1 420px;
  min-width: 0;
}

.rv-users__status {
  flex: 0 0 190px;
}

.rv-users__search {
  flex: 1 1 220px;
  min-width: 0;
}

.rv-users__search .rv-search {
  margin-bottom: 0;
}

.rv-users__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.rv-users__actions [hidden] {
  display: none;
}

.rv-users__actions .rv-btn:disabled {
  opacity: 0.45;
  filter: grayscale(1);
}

.rv-users__hint {
  margin: 0 0 10px;
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-users__hint[hidden],
.rv-users__hint:empty {
  display: none;
}

/* -------------------------------------------------------------- table --- */
.rv-users__table-card {
  overflow: hidden;
}

/* Narrow screens: the table scrolls inside its card, never the page. */
.rv-users__scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.rv-table {
  width: 100%;
  min-width: 760px;
  border-collapse: collapse;
  font-size: 14px;
}

.rv-table th,
.rv-table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--rv-divider);
  text-align: left;
  vertical-align: middle;
}

.rv-table thead th {
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  white-space: nowrap;
}

.rv-table tbody tr:last-child td {
  border-bottom: 0;
}

.rv-table__pick {
  width: 72px;
  text-align: center !important;
}

.rv-table__pick input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--rv-red);
  cursor: pointer;
}

.rv-table__row {
  cursor: pointer;
  transition: background 0.12s ease;
}

.rv-table__row:hover {
  background: var(--rv-surface-muted);
}

.rv-table__row.is-selected {
  background: var(--rv-red-tint);
  box-shadow: inset 3px 0 0 var(--rv-red);
}

.rv-table__row.is-inactive td:not(.rv-table__pick) {
  color: var(--rv-muted);
}

.rv-table__nowrap {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.rv-table__email {
  white-space: nowrap;
}

.rv-users__sort {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 32px;
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  cursor: pointer;
}

.rv-users__sort .rv-icon {
  opacity: 0.45;
}

.rv-users__sort.is-active {
  color: var(--rv-ink);
}

.rv-users__sort.is-active .rv-icon {
  opacity: 1;
  color: var(--rv-red);
}

.rv-users__sort:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: 2px;
  border-radius: 6px;
}

.rv-pager {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 14px;
}

.rv-pager[hidden] {
  display: none;
}

.rv-pager__info {
  color: var(--rv-muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

/* ---------------------------------------------------- user detail page --- */
.rv-user-header {
  margin-bottom: 16px;
}

.rv-user-section {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.rv-user-section__title {
  margin: 4px 0 0;
  font-size: 15px;
  font-weight: 800;
}

.rv-user-section__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 10px;
}

.rv-user-section__alt {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--rv-divider);
}

.rv-user-profile-form,
.rv-user-password-form {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rv-user-section .rv-screen__error {
  margin: 0;
}

.rv-user-facts {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px 20px;
  margin: 0;
}

.rv-user-facts div {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.rv-user-facts dt {
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-user-facts dd {
  margin: 0;
  font-weight: 600;
  overflow-wrap: anywhere;
}

@media (max-width: 560px) {
  .rv-user-facts {
    grid-template-columns: minmax(0, 1fr);
  }
}

.rv-check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
}

.rv-check input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--rv-red);
}

.rv-user-success {
  margin: 0;
  padding: 12px 14px;
  border-radius: var(--rv-radius-field);
  background: var(--rv-green-soft);
  color: var(--rv-green-text);
  font-size: 14px;
  font-weight: 600;
}

.rv-user-success[hidden],
.rv-user-dirty[hidden] {
  display: none;
}

.rv-user-dirty {
  margin: 0;
  color: var(--rv-red-text);
  font-size: 13px;
  font-weight: 700;
  text-align: right;
}

.rv-notice--warn {
  background: #fff8e1;
}

.rv-notice--warn .rv-icon {
  color: #a16207;
}

/* ------------------------------------------------------ PRAVA PRISTUPA --- */
.rv-rights {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.rv-rights__role {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
  border: 0;
}

.rv-rights__role .rv-segmented {
  max-width: 460px;
}

.rv-rights__role input:disabled + span {
  cursor: not-allowed;
}

.rv-rights__message {
  margin: 0;
  padding: 10px 12px;
  border-radius: var(--rv-radius-field);
  background: var(--rv-red-soft);
  color: var(--rv-red-text);
  font-size: 13px;
  font-weight: 600;
}

.rv-rights__message[hidden] {
  display: none;
}

.rv-rights__group.is-invalid {
  border-color: var(--rv-red);
}

/* Nested in a section: a quieter card. */

`,"app/css/reports.css":`/* Renvara · IZVJEŠTAJI (reports.html): report type and filters, the report as
   generated (key figures, charts, tables, notes), the PDF preview and the
   recent e-mails. Same tokens and components as the rest of the app. */

.rv-reports__panel {

.rv-reports__hint {

}

.rv-reports__hint:empty {

.rv-report__title {

.rv-report-tile--won .rv-report-tile__value {

.rv-report-tile--lost .rv-report-tile__value {

.rv-report-tile__hint {

.rv-report-section-title {

.rv-report-tone--won {

.rv-report-columns__value {

/* ------------------------------------------------------------ tables --- */
.rv-report-table-card {

}

.rv-report-table-scroll {

.rv-report-table tbody th {

.rv-report-empty {

.rv-report-notes ul {

.rv-pdf-overlay {

/* --------------------------------------------------------- recent sends --- */

`,"app/css/web.css":`/* =============================================================================
   Renvara · web app layout (loaded last on every page; ADR-0013).

   The navigation (ui/app-shell.js), the same items on every page:
     1024 px+   a sidebar on the left (256 px, or 76 px with icons only)
     < 1024 px  a top bar with the menu button; the sidebar slides in as a drawer
   Content uses the width of the window: KPI cards in one row, Home modules in
   two columns, forms on a card. No bottom navigation, no floating "+".
   Colours: Renvara red (matte) with green accents, light only.
   ========================================================================== */

:root {
  --web-side: 256px;
  --web-side-narrow: 76px;
  --web-bar: 56px;
  --web-ink: #111111;
  --web-muted: #6b7079;
  --web-red: #e32222;
  --web-red-hover: #c91c1c;
  --web-red-text: #c81e1e;
  --web-red-soft: #fff1f1;
  --web-green: #12ae55;
  --web-green-soft: #eaf8ef;
  --web-border: #eceef1;
  --web-canvas: #f6f7f8;
  --web-bg: #ffffff;
  --web-shadow: 0 1px 2px rgba(17, 17, 17, 0.04), 0 12px 32px rgba(17, 17, 17, 0.06);
  --web-shadow-panel: 0 16px 40px rgba(17, 17, 17, 0.16), 0 2px 6px rgba(17, 17, 17, 0.06);
  --web-font:
    -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Arial, sans-serif;
}

/* ---------------------------------------------------------- page base --- */
body:has(> .rv-side) {
  min-height: 100dvh;
  background: var(--web-canvas);
}

html:has(.rv-side.is-open) {
  overflow: hidden;
}

.rv-skip {
  position: fixed;
  z-index: 1300;
  top: 8px;
  left: 8px;
  padding: 10px 14px;
  border-radius: 10px;
  background: var(--web-ink);
  color: #ffffff;
  font: 600 14px/1 var(--web-font);
  text-decoration: none;
  transform: translateY(-150%);
}

.rv-skip:focus {
  transform: none;
}

/* ------------------------------------------------------------- sidebar --- */
.rv-side {
  position: fixed;
  z-index: 900;
  inset: 0 auto 0 0;
  display: flex;
  flex-direction: column;
  gap: 14px;
  width: var(--web-side);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 14px 16px;
  overflow-x: hidden;
  overflow-y: auto;
  background: var(--web-bg);
  border-right: 1px solid var(--web-border);
  font-family: var(--web-font);
  color: var(--web-ink);
  -webkit-font-smoothing: antialiased;
  scrollbar-width: thin;
}

.rv-side__top {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 0 4px 0 8px;
}

.rv-side__brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  color: var(--web-ink);
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-decoration: none;
}

.rv-side__brand img {
  flex: none;
  width: auto;
  height: 30px;
}

.rv-side__collapse,
.rv-side__close,
.rv-mobilebar__btn {
  display: inline-grid;
  place-items: center;
  flex: none;
  width: 40px;
  height: 40px;
  margin-left: auto;
  padding: 0;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--web-muted);
  cursor: pointer;
}

.rv-side__collapse:hover,
.rv-side__close:hover,
.rv-mobilebar__btn:hover {
  background: var(--web-canvas);
  color: var(--web-ink);
}

/* "+ Novo": Quick Add (Novi kupac, Nova prilika, Novi kontakt, Novi zadatak, Novi lead). */
.rv-side__new {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 14px;
  border: 0;
  border-radius: 12px;
  background: var(--web-red);
  color: #ffffff;
  font: 700 15px/1 var(--web-font);
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(227, 34, 34, 0.25);
  transition: background-color 0.15s ease;
}

.rv-side__new:hover {
  background: var(--web-red-hover);
}

.rv-nav {
  flex: 1 0 auto;
}

.rv-nav__list,
.rv-nav__sublist {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.rv-nav__item,
.rv-nav__subitem {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: #3b3f45;
  font: 500 15px/1.2 var(--web-font);
  text-align: left;
  text-decoration: none;
  cursor: pointer;
  transition:
    background-color 0.15s ease,
    color 0.15s ease;
}

.rv-nav__item:hover,
.rv-nav__subitem:hover {
  background: var(--web-canvas);
  color: var(--web-ink);
}

.rv-nav__item.is-active,
.rv-nav__subitem.is-active {
  background: var(--web-red-soft);
  color: var(--web-red-text);
  font-weight: 650;
}

/* The page you are on: a red bar at the edge. */
.rv-nav__item.is-active::before,
.rv-nav__subitem.is-active::before {
  content: '';
  position: absolute;
  top: 10px;
  bottom: 10px;
  left: 0;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--web-red);
}

.rv-nav__toggle.has-active {
  color: var(--web-ink);
  font-weight: 650;
}

.rv-nav__icon {
  flex: none;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.9;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.rv-nav__label {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rv-nav__chevron {
  flex: none;
  width: 16px;
  height: 16px;
  margin-left: auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  transition: transform 0.2s ease;
}

.rv-nav__group.is-open > .rv-nav__toggle .rv-nav__chevron {
  transform: rotate(180deg);
}

/* Dropdown lists: open and close smoothly (height from 0 to its content). */
.rv-nav__sub {
  display: grid;
  grid-template-rows: 0fr;
  visibility: hidden;
  transition:
    grid-template-rows 0.2s ease,
    visibility 0s linear 0.2s;
}

.rv-nav__group.is-open > .rv-nav__sub {
  grid-template-rows: 1fr;
  visibility: visible;
  transition:
    grid-template-rows 0.2s ease,
    visibility 0s;
}

.rv-nav__sublist {
  min-height: 0;
  overflow: hidden;
  margin-left: 22px;
  padding-left: 10px;
  border-left: 1px solid var(--web-border);
}

/* Inside the clipped list, so a closed list takes no space at all. */
.rv-nav__sublist > li:first-child {
  margin-top: 2px;
}

.rv-nav__sublist > li:last-child {
  margin-bottom: 4px;
}

.rv-nav__subitem {
  min-height: 40px;
  gap: 10px;
  font-size: 14.5px;
}

.rv-nav__subitem .rv-nav__icon {
  width: 18px;
  height: 18px;
}

.rv-side__bottom {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding-top: 12px;
  border-top: 1px solid var(--web-border);
}

.rv-side__profile {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  padding: 6px 8px 10px;
}

.rv-side__avatar {
  position: relative;
  display: grid;
  place-items: center;
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--web-ink);
  color: #ffffff;
  font-size: 13px;
  font-weight: 700;
}

/* Signed in: a green dot. */
.rv-side__avatar::after {
  content: '';
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 11px;
  height: 11px;
  border: 2px solid var(--web-bg);
  border-radius: 50%;
  background: var(--web-green);
}

.rv-side__user {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.rv-side__user-name,
.rv-side__user-role {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rv-side__user-name {
  font-size: 14px;
  font-weight: 700;
}

.rv-side__user-role {
  color: var(--web-muted);
  font-size: 12.5px;
}

.rv-side__logout:disabled {
  cursor: progress;
  opacity: 0.6;
}

.rv-side :focus-visible,
.rv-mobilebar :focus-visible {
  outline: 2px solid var(--web-red);
  outline-offset: 2px;
}

/* ------------------------------------------------ top bar (< 1024 px) --- */
.rv-mobilebar {
  position: sticky;
  z-index: 60;
  top: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: calc(var(--web-bar) + env(safe-area-inset-top, 0px));
  padding: env(safe-area-inset-top, 0px) 8px 0;
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--web-border);
  font-family: var(--web-font);
}

.rv-mobilebar .rv-side__brand {
  font-size: 17px;
}

.rv-mobilebar .rv-side__brand img {
  height: 26px;
}

.rv-mobilebar__btn:first-child {
  margin-left: 0;
}

.rv-mobilebar__new {
  background: var(--web-red);
  color: #ffffff;
}

.rv-mobilebar__new:hover {
  background: var(--web-red-hover);
  color: #ffffff;
}

.rv-side-backdrop {
  position: fixed;
  z-index: 890;
  inset: 0;
  background: rgba(17, 17, 17, 0.36);
  animation: rv-fade-in 0.2s ease;
}

.rv-side-backdrop[hidden] {
  display: none;
}

@keyframes rv-fade-in {
  from {
    opacity: 0;
  }
}

@media (max-width: 1023.98px) {
  .rv-side {
    width: min(304px, 86vw);
    box-shadow: var(--web-shadow-panel);
    transform: translateX(-105%);
    visibility: hidden;
    transition:
      transform 0.22s ease,
      visibility 0s linear 0.22s;
  }

  .rv-side.is-open {
    transform: none;
    visibility: visible;
    transition:
      transform 0.22s ease,
      visibility 0s;
  }

  .rv-side__collapse {
    display: none;
  }

  /* Forms and record pages: their own header stays under the top bar. */
  body:has(> .rv-side) .rv-screen__header {
    top: calc(var(--web-bar) + env(safe-area-inset-top, 0px));
    padding-top: 0;
  }
}

@media (min-width: 1024px) {
  .rv-mobilebar,
  .rv-side-backdrop,
  .rv-side__close {
    display: none;
  }

  body:has(> .rv-side) {
    padding-left: var(--web-side);
    transition: padding-left 0.2s ease;
  }

  /* --------------------------------------- narrow sidebar: icons only --- */
  body:has(> .rv-side[data-collapsed]) {
    padding-left: var(--web-side-narrow);
  }

  .rv-side[data-collapsed] {
    width: var(--web-side-narrow);
    padding-right: 12px;
    padding-left: 12px;
  }

  .rv-side[data-collapsed] .rv-side__top {
    flex-direction: column;
    gap: 10px;
    padding: 0;
  }

  .rv-side[data-collapsed] .rv-side__brand-name,
  .rv-side[data-collapsed] .rv-nav__item > .rv-nav__label,
  .rv-side[data-collapsed] .rv-side__new > .rv-nav__label,
  .rv-side[data-collapsed] .rv-nav__toggle > .rv-nav__chevron,
  .rv-side[data-collapsed] .rv-side__user {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }

  .rv-side[data-collapsed] .rv-side__collapse {
    margin: 0;
  }

  .rv-side[data-collapsed] .rv-side__new,
  .rv-side[data-collapsed] .rv-nav__item {
    justify-content: center;
    padding: 0;
  }

  .rv-side[data-collapsed] .rv-side__profile {
    justify-content: center;
    padding: 6px 0 10px;
  }

  /* A list opens as a panel beside its icon (top set by ui/app-shell.js). */
  .rv-side[data-collapsed] .rv-nav__sub {
    position: fixed;
    z-index: 950;
    left: calc(var(--web-side-narrow) + 8px);
    display: none;
    width: 240px;
    padding: 8px;
    background: var(--web-bg);
    border: 1px solid var(--web-border);
    border-radius: 14px;
    box-shadow: var(--web-shadow-panel);
  }

  .rv-side[data-collapsed] .rv-nav__group.is-open > .rv-nav__sub {
    display: block;
  }

  .rv-side[data-collapsed] .rv-nav__sublist {
    overflow: visible;
    margin: 0;
    padding: 0;
    border: 0;
  }

  .rv-side[data-collapsed] .rv-nav__sublist::before {
    content: attr(aria-label);
    padding: 6px 12px 8px;
    color: var(--web-muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .rv-side[data-collapsed] .rv-nav__toggle.has-active {
    background: var(--web-red-soft);
    color: var(--web-red-text);
  }
}

@media (prefers-reduced-motion: reduce) {
  .rv-side,
  .rv-nav__sub,
  .rv-nav__chevron,
  body:has(> .rv-side) {
    transition: none !important;
  }
}

/* =========================================================== content === */

/* Home, Follow-up engine, Leads, Postavke, Izvještaji, Korisnici. */
body:has(> .rv-side) .app {
  max-width: 1440px;
  min-height: 0;
  background: transparent;
}

body:has(> .rv-side) .content {
  padding-bottom: 56px;
}

.page-header {
  padding: 24px var(--page-x, 16px) 16px;
}

.page-header__title {
  margin: 0;
  color: var(--web-ink);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.page-header__sub {
  display: block;
  margin-top: 4px;
  color: var(--web-muted);
  font-size: 14px;
}

/* Toasts: above the bottom edge (no bottom navigation any more). */
body:has(> .rv-side) .toast,
body:has(> .rv-side) .rv-toast {
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
}

/* Customers, Prilike, Zadaci, Sales kalendar, pipeline, Feedback overview. */
body:has(> .rv-side) .rv-page {
  max-width: 1360px;
}

/* A record page's way back (to where it was opened from, else its list). */
.rv-backlink {
  display: inline-flex;
  border: 0;
  background: none;
  font-family: inherit;
  cursor: pointer;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  margin: 0 0 8px -8px;
  padding: 0 10px 0 6px;
  border-radius: 10px;
  color: var(--web-muted);
  font-size: 14px;
  font-weight: 600;
  text-decoration: none;
}

.rv-backlink:hover {
  background: var(--web-bg);
  color: var(--web-ink);
}

.rv-backlink .rv-icon {
  width: 18px;
  height: 18px;
}

/* Forms and record pages: the header bar and the body card. */
body:has(> .rv-side) .rv-screen__header {
  background: rgba(255, 255, 255, 0.96);
}

@media (min-width: 768px) {
  :root {
    --page-x: 24px;
  }

  .page-header {
    padding-top: 32px;
  }

  .page-header__title {
    font-size: 28px;
  }

  /* KPI cards: all in one row instead of a sideways scroller. */
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
    gap: 12px;
    margin: 0;
    padding: 2px 0 6px;
    overflow: visible;
  }

  .metric {
    min-width: 0;
  }

  .rv-screen__header-inner {
    max-width: 860px;
    padding: 0 16px;
  }

  .rv-screen__body {
    max-width: 860px;
    margin: 28px auto 56px;
    padding: 32px 36px 36px;
    background: var(--web-bg);
    border: 1px solid var(--web-border);
    border-radius: 20px;
    box-shadow: var(--web-shadow);
  }
}

@media (min-width: 1024px) {
  :root {
    --page-x: 32px;
  }

  /* Home: Sales Kalendar beside Prioritetni zadaci; pipeline and Feedback overview below. */
  .dashboard-view:not([hidden]) {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: start;
  }

  .dashboard-view > .split {
    grid-column: 1 / -1;
    gap: var(--gap-lg);
  }

  .rv-page {
    padding-right: 32px;
    padding-left: 32px;
  }
}

/* "+ Novo" without any form the member may open (core/permissions.js). */
.rv-side__new[hidden],
.rv-mobilebar__btn[hidden] {
  display: none;
}
