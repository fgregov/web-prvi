<title>Renvara Demo</title>
<meta name="theme-color" content="#ffffff" />
<style id="rv-shell-css">
  /* Renvara demo shell. The app is light-only by design (see prototypes/home). */
  :root {
    color-scheme: light;
    --rv-demo-bg: #ffffff;
    --rv-demo-muted: #737982;
    --rv-demo-note-bg: #fff1f1;
    --rv-demo-note-ink: #c81e1e;
  }
  body {
    background: var(--rv-demo-bg);
  }
  #rv-root:empty::before {
    content: 'Učitavanje Renvare…';
    display: block;
    padding: 48px 16px;
    color: var(--rv-demo-muted);
    font:
      15px -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      Arial,
      sans-serif;
    text-align: center;
  }
  .intro .demo-note {
    margin: 12px 0 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--rv-demo-note-bg);
    color: var(--rv-demo-note-ink);
    font-size: 13px;
    line-height: 1.4;
  }
</style>

      <main class="signin">
        <div class="intro">
          <h1>Dobro došli natrag</h1>
          <p>Prijavite se i pogledajte što slijedi.</p>
<p class="demo-note">Demo: prijava prihvaća bilo koje korisničko ime i lozinku. Podaci se spremaju samo u ovom pregledniku.</p>
        </div>

        <form id="login-form" class="form" novalidate>
          <div class="field-group">
            <label class="label" for="login-username">E-mail ili korisničko ime</label>
            <input
              class="input"
              id="login-username"
              name="username"
              value="demo"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              maxlength="128"
              placeholder="ime@tvrtka.hr"
              required
              aria-describedby="login-message"
            />
          </div>

          <div class="field-group">
            <label class="label" for="login-password">Lozinka</label>
            <div class="password">
              <input
                class="password__input"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="512"
                placeholder="Vaša lozinka"
                required
                aria-describedby="login-message"
              value="demo" />
              <button
                class="password__toggle"
                id="password-toggle"
                type="button"
                aria-label="Prikaži lozinku"
                aria-pressed="false"
              >
                <svg class="icon icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18"></path>
                  <path
                    d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5.4-1.6"
                  ></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="forgot">
            <button class="text-button" type="button" data-forgot>Zaboravljena lozinka?</button>
          </div>

          <p class="form-message" id="login-message" role="alert" aria-live="assertive" hidden></p>

          <button class="primary" id="login-submit" type="submit">Prijava</button>
        </form>

        <div class="divider" aria-hidden="true">
          <span class="divider__line"></span>
          <span class="divider__text">ili</span>
          <span class="divider__line"></span>
        </div>

        <div class="socials">
          <button class="social social--apple" type="button" data-unavailable>
            <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.8-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.7 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-3.8zM14 5.3c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"
              ></path>
            </svg>
            Nastavi s Appleom
          </button>
          <button class="social social--google" type="button" data-unavailable>
            <svg class="social__icon social__icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h4.8a4.3 4.3 0 0 1-1.8 2.7"></path>
              <path d="M15 16.6A7.6 7.6 0 0 1 4.6 13"></path>
              <path d="M4.6 13a7.6 7.6 0 0 1 0-2.2"></path>
              <path d="M4.6 10.8A7.6 7.6 0 0 1 16.9 7"></path>
            </svg>
            Nastavi s Googleom
          </button>
        </div>

        <div class="spacer"></div>
        <p class="footer">
          Novi ste u Renvari?
          <button class="text-button text-button--inline" type="button" data-unavailable>
            Izradite račun
          </button>
        </p>
      </main>

    <footer class="ov-footer"><p>Demo: ovako kupac vidi ponudu. Otvaranje ovdje bilježi se kao pregled kupca kako bi se vidio Follow-up Engine na djelu. U demou poveznica radi samo u ovom pregledniku; na BETA serveru kupac je otvara na svom uređaju, bez prijave.</p></footer>`,scripts:[{kind:`module`,src:`viewer/viewer.js`}]}},qd={"login/login.css":`/* Renvara BETA · Prijava — the approved white sign-in design, unchanged in layout. */
:root {
  --red: #c42127;
  --red-text: #a81b20;
  --ink: #14161a;
  --label: #3f4450;
  --muted: #5b616e;
  --field-border: #d5d9e0;
  --field-bg: #f8f9fa;
  --line: #e3e5ea;
  --bg: #ffffff;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--bg);
}

body {
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font-family: inherit;
}

input::placeholder {
  color: #8a909c;
}

.page {
  max-width: 430px;
  min-height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 40px) 24px
    calc(env(safe-area-inset-bottom, 0px) + 28px);
}

/* Brand */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.brand__logo {
  display: block;
  width: auto;
  height: 94px;
  margin: 19px 0 15px;
}

.brand__name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.32em;
  padding-left: 0.32em;
  color: var(--red);
}

/* Sign in */
.signin {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-top: 28px;
}

.intro {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: center;
}

.intro h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.intro p {
  margin: 0;
  font-size: 15px;
  color: var(--muted);
}

.form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.label {
  font-size: 13px;
  font-weight: 700;
  color: var(--label);
}

.input,
.password {
  height: 50px;
  border-radius: 14px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
}

.input {
  width: 100%;
  padding: 0 16px;
  font-size: 16px;
  color: var(--ink);
  outline-color: var(--red);
}

.password {
  display: flex;
  align-items: center;
  padding: 0 4px 0 16px;
}

.password:focus-within {
  outline: 2px solid var(--red);
  outline-offset: 1px;
}

.password__input {
  flex: 1 1 auto;
  min-width: 0;
  height: 44px;
  border: 0;
  background: transparent;
  font-size: 16px;
  color: var(--ink);
  outline: none;
}

.password__toggle {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.password__toggle .icon--hide,
.password__toggle[aria-pressed='true'] .icon--show {
  display: none;
}

.password__toggle[aria-pressed='true'] .icon--hide {
  display: block;
}

[aria-invalid='true'].input,
.password:has([aria-invalid='true']) {
  border-color: var(--red);
}

.forgot {
  display: flex;
  justify-content: flex-end;
  margin-top: -4px;
}

.text-button {
  height: 44px;
  padding: 0 4px;
  border: 0;
  background: transparent;
  color: var(--red-text);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.text-button--inline {
  height: auto;
  min-height: 24px;
  padding: 0;
  font-size: inherit;
}

.form-message {
  margin: -2px 0 0;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--red-text);
  text-align: center;
}

.form-message[data-kind='info'] {
  color: var(--muted);
}

.form-message[hidden] {
  display: none;
}

.primary {
  height: 52px;
  border: 0;
  border-radius: 14px;
  background: var(--red);
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  margin-top: -6px;
  cursor: pointer;
}

.primary:disabled {
  cursor: progress;
  opacity: 0.75;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
}

.divider__line {
  flex: 1 1 auto;
  height: 1px;
  background: var(--line);
}

.divider__text {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.socials {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.social {
  height: 50px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.social--apple {
  border: 0;
  background: var(--ink);
  color: #ffffff;
}

.social--google {
  border: 1px solid var(--field-border);
  background: var(--bg);
  color: var(--ink);
}

.social__icon {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.social__icon--stroke {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
}

.spacer {
  flex: 1 1 auto;
}

.footer {
  margin: 0;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}

.text-button:focus-visible,
.primary:focus-visible,
.social:focus-visible,
.password__toggle:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
}

/* Tablets and computers: the sign-in on a card (phones unchanged). Kept here,

   Renvara · Mobile home / dashboard
   Reference-faithful implementation. Light theme only (by specification).
   ========================================================================== */

:root {
  /* Color */
  --bg: #ffffff;
  --text: #111111;

  --border: #eceef1;
  --surface-muted: #f6f7f8;
  --divider: #f0f1f3;

  --bar-track: #eef0f2;
  --bar-new: #d3d7dc;
  --bar-progress: #f08585;
  --bar-offer: #f8c0c0;
  --bar-negotiation: #a9dfbb;
  --bar-closing: #12ae55;

  /* Typography */
  --font:
    -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Arial, sans-serif;
  --fs-xs: 0.6875rem; /* 11 */
  --fs-sm: 0.8125rem; /* 13 */
  --fs-md: 0.9375rem; /* 15 */
  --fs-lg: 1.25rem; /* 20 */
  --fs-xl: 1.625rem; /* 26 */

  /* Spacing */
  --page-x: 16px;
  --gap: 12px;
  --gap-sm: 8px;
  --gap-lg: 16px;

  /* Shape & depth */
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(17, 17, 17, 0.04), 0 4px 14px rgba(17, 17, 17, 0.04);
  --shadow-fab: 0 6px 16px rgba(227, 34, 34, 0.35), 0 2px 4px rgba(17, 17, 17, 0.12);
  --shadow-menu: 0 12px 32px rgba(17, 17, 17, 0.14), 0 2px 6px rgba(17, 17, 17, 0.06);

  /* Layout */
  --app-max: 430px;
  --tabbar-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------------------------------------------------------------- base --- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-align: inherit;
}

a {

  text-decoration: none;
}

:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
  border-radius: 8px;
}

.sprite {

}

.icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon--filled {
  fill: currentColor;
  stroke: none;
}

/* ------------------------------------------------------------- shell --- */
.app {
  position: relative;
  max-width: var(--app-max);
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
}

.content {
  display: flex;
  flex-direction: column;
  gap: var(--gap-lg);
  padding: 4px var(--page-x) calc(var(--tabbar-h) + var(--safe-bottom) + 88px);
}

/* ------------------------------------------------------------ header --- */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: calc(env(safe-area-inset-top, 0px) + 18px) var(--page-x) 16px;

}

}

.account-menu[hidden] {

}

.account-menu__name {
  margin: 0;
  padding: 8px 12px 6px;

}

.account-menu button {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-md);
  font-weight: 500;
}

.account-menu button:hover,
.account-menu button:focus-visible {
  background: var(--red-soft);
}

.account-menu .icon {
  color: var(--red);
}

.avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ----------------------------------------------------------- metrics --- */
.metrics {
  display: flex;
  gap: var(--gap-sm);
  margin: 0 calc(var(--page-x) * -1);
  padding: 2px var(--page-x) 6px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scroll-padding-inline: var(--page-x);
  scrollbar-width: none;
}

.metrics::-webkit-scrollbar {
  display: none;
}

.metric {
  position: relative;
  flex: 0 0 106px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 10px 12px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  scroll-snap-align: start;
  transition: transform 0.12s ease;
}

.metric:active {
  transform: scale(0.98);
}

.metric__label {
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.metric__row {
  display: flex;
  align-items: center;
  justify-content: space-between;

.metric__value {

.metric__icon {

.metric__icon .icon {

.metric__icon--red {

}

.metric__icon--green {
  background: var(--green-soft);
  color: var(--green);

.metric__icon--plain {

}

.metric__icon--plain .icon {

.trend {

.trend .icon {

/* ------------------------------------------------------ module cards --- */
.card {

.module__head {

/* A long title and link (PRIORITETNI ZADACI · Pogledaj sve zadatke): on a narrow

.module__head--wrap .module__link {

.module__title {

.module__link {

.module__link .icon {

.list {

.list > li + li {

.chevron {

/* DANAS rows */
.event {

.event:active,

.dot {

.dot--green {

.dot--red {

}

.dot--gray {

}

.event__text,
.waiting__text {

}

.event__title {

  font-weight: 600;
  line-height: 1.25;
}

.event__sub {
  font-size: var(--fs-sm);

}

.event__time--all-day {

/* Completed calendar entry: green check instead of the dot, stays visible as history. */
.event__done {

  height: 18px;
  margin-left: -4px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--green);
  color: #ffffff;
}

.event__done .icon {
  width: 12px;
  height: 12px;
  stroke-width: 3.4;
}

.event--done .event__title {
  color: var(--text-muted);
}

.empty-row {
  padding: 16px 14px;
  font-size: var(--fs-sm);

}

/* PRIORITETI rows */
.task {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 8px;
  padding: 6px 14px 6px 8px;

}

.task__check {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.task__check::before {

.task__check .icon {

.module--compact .module__title {

}

.module--compact .module__link {

  min-height: 24px;
}

.module--compact .module__link .icon {
  width: 13px;
  height: 13px;
}

@container (max-width: 199px) {
  .module--compact .module__head {

  }

  .module--compact .module__link {

    justify-self: end;
    min-height: 20px;

  }
}

/* Pipeline: one shared grid so bars line up across rows */
.pipeline {
  display: grid;
  grid-template-columns: max-content minmax(20px, 1fr) 20px;
  margin: 0;
  padding: 0 0 6px;
  list-style: none;
}

.pipeline > li {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
}

.stage {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  align-items: center;
  column-gap: 8px;
  min-height: 36px;
  padding: 0 10px;
}

.stage__label {
  font-size: 0.78rem;
  white-space: nowrap;
}

.stage__track {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--bar-track);
  overflow: hidden;
}

.stage__fill {

  width: var(--fill);
  height: 100%;
  border-radius: inherit;
  background: var(--bar);
}

.stage__count {
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* Čekaš odgovor */
.module--compact .list > li + li {
  border-top: 1px solid var(--divider);
}

.waiting {
  width: 100%;
  min-height: 52px;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto 10px;
  align-items: center;
  column-gap: 5px;
  padding: 8px 6px 8px 8px;
}

.waiting__icon {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: var(--surface-muted);
  color: #8a9099;
}

.waiting__icon .icon {
  width: 15px;
  height: 15px;
}

.waiting__name {
  font-size: 0.78rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;

}

.waiting__sub {

  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.waiting__days {
  font-size: 0.6875rem;
  font-weight: 500;
  color: var(--red-text);
  white-space: nowrap;
}

.waiting .chevron {
  width: 10px;
  height: 10px;
}

/* ---------------------------------------------------------- quick add --- */
.quick-add {
  position: fixed;
  z-index: 30;
  right: max(var(--page-x), calc((100vw - var(--app-max)) / 2 + var(--page-x)));
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 14px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.fab {
  width: 60px;
  height: 60px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--red);
  color: #ffffff;
  box-shadow: var(--shadow-fab);
  transition: transform 0.18s ease;
}

.fab .icon {
  width: 28px;
  height: 28px;
  stroke-width: 2.4;
}

.fab[aria-expanded='true'] {

}

/* The Quick Add sheet itself: .rv-sheet / .rv-quick-add in /app/css/components.css. */

/* ------------------------------------------------------------- tabbar --- */
.tabbar {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(100%, var(--app-max));
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 6px 4px var(--safe-bottom);

}

.tab {

  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 48px;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: #7c828b;
}

.tab .icon {
  width: 25px;
  height: 25px;
  stroke-width: 1.8;
}

.tab.is-active {
  color: var(--red);
  font-weight: 600;
}

.tab__label {
  text-align: center;
  line-height: 1.15;
}

/* "Follow-up / Engine": two compact lines, same size as the other labels. */
.tab--two-line {
  gap: 2px;
}

.tab--two-line .icon {
  width: 23px;
  height: 23px;
}

/* -------------------------------------------------------- period bar --- */
.period {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: -6px;
}

.period__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap-sm);
  min-width: 0;
}

.period__trigger {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 40px;
  margin-left: -2px;
  padding: 0 6px 0 2px;
  border-radius: var(--radius-sm);
}

.period__trigger:active {
  background: var(--surface-muted);
}

.period__title {
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: -0.01em;
}

.period__chevron {
  width: 20px;
  height: 20px;
  color: var(--red);
  stroke-width: 2.4;
}

.period__state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: var(--surface-muted);
  color: var(--text-muted);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
}

.period__state .icon {
  width: 13px;
  height: 13px;
}

.period__state--live {
  background: var(--green-soft);
  color: var(--green-text);
}

.period__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.period__row--sub {
  justify-content: flex-start;
  flex-wrap: wrap;
  column-gap: var(--gap);
}

.period__range {
  font-size: var(--fs-sm);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.period__back {
  min-height: 28px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--red);
}

/* ----------------------------------------------- views and loading --- */
.dashboard-view {
  display: flex;
  flex-direction: column;
  gap: var(--gap-lg);
}

.dashboard-view[hidden] {
  display: none;
}

.is-entering {
  animation: view-in 0.22s ease-out;
}

@keyframes view-in {
  from {
    opacity: 0;
  }
}

.skeleton {
  display: block;
  border-radius: 6px;
  background: var(--surface-muted);
  animation: skeleton-pulse 1.1s ease-in-out infinite alternate;
}

.skeleton--label {
  width: 70%;
  height: 10px;
}

.skeleton--value {
  width: 55%;
  height: 22px;
  margin: 5px 0;
}

.metric.is-skeleton {
  pointer-events: none;
}

.skeleton-card {
  background: var(--surface-muted);
  border-color: var(--divider);
  box-shadow: none;
  animation: skeleton-pulse 1.1s ease-in-out infinite alternate;
}

@keyframes skeleton-pulse {
  to {
    opacity: 0.55;
  }
}

.trend--down {
  color: var(--red-text);
}

.trend--none {
  color: var(--text-muted);
}

.pill--muted {
  background: var(--surface-muted);
  color: var(--text-muted);
}

/* -------------------------------------------- historical dashboard --- */
/* Same cards; neutral heads say "a closed period", green says "done". */
.module--history .module__head {
  background: var(--surface-muted);
}

.module--history:not(.module--compact) .module__title {
  font-size: 1.125rem;
}

.module--history.module--compact .module__head {
  background: var(--bg);
}

.hist-summary {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  margin: 0;
  padding: 10px 14px;
  border-bottom: 1px solid var(--divider);
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

.hist-summary__item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}

.hist-summary__item.is-done {
  color: var(--green-text);
}

.hist-summary__item .icon {
  width: 14px;
  height: 14px;
  stroke-width: 3;
}

.event__time {
  font-variant-numeric: tabular-nums;
}

.event--history .event__time {
  font-size: var(--fs-sm);
}

.hist-check,
.hist-open {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
}

.hist-check {
  background: var(--green);
  color: #ffffff;
}

.hist-check .icon {
  width: 13px;
  height: 13px;
  stroke-width: 3.2;
}

.hist-open {
  border: 2px solid #c9ced6;
}

.hist-task {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 12px;
  min-height: 52px;
  padding: 8px 14px;
}

.hist-task__title {
  font-size: var(--fs-md);
  line-height: 1.3;
}

.hist-task:not(.is-done) .hist-task__title {
  color: var(--text-muted);
}

.hist-leads {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px;
}

.hist-big {
  margin: 0;
  font-size: var(--fs-md);
  color: var(--text-muted);
}

.hist-big strong {
  font-size: var(--fs-xl);
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}

.hist-bars {
  display: grid;
  grid-template-columns: max-content minmax(40px, 1fr) 28px;
  row-gap: 8px;
  column-gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.hist-bar {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  align-items: center;
  font-size: var(--fs-sm);
}

.hist-bar__track {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--bar-track);
  overflow: hidden;
}

.hist-bar__fill {
  display: block;
  width: var(--fill);
  height: 100%;
  border-radius: inherit;
}

.hist-bar__fill--red {
  background: var(--bar-progress);
}

.hist-bar__fill--green {
  background: var(--green);
}

.hist-bar__fill--gray {
  background: var(--bar-new);
}

.hist-bar__value {
  text-align: right;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.hist-revenue {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 8px 16px;
  padding: 12px 14px 14px;
  border-top: 1px solid var(--divider);
}

.hist-revenue__main,
.hist-revenue__avg {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.hist-revenue__label,
.hist-revenue__avg span {
  font-size: var(--fs-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
}

.hist-revenue__value {
  font-size: var(--fs-xl);
  font-weight: 800;
  letter-spacing: -0.02em;
}

.hist-revenue__change {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--green-text);
}

.hist-revenue__change.is-down {
  color: var(--red-text);
}

.hist-revenue__avg {
  align-items: flex-end;
  text-align: right;
}

.hist-revenue__avg strong {
  font-size: var(--fs-md);
  font-weight: 700;
}

.hist-caption {
  margin: 0;
  padding: 0 10px 6px;
  font-size: 0.6875rem;
  color: var(--text-muted);
}

.hist-leads__ratios {
  padding: 0;
  font-variant-numeric: tabular-nums;
}

.stage--static {
  cursor: default;
}

.stage--won .stage__label {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  color: var(--green-text);
  font-weight: 600;
}

.stage__check {
  width: 12px;
  height: 12px;
  stroke-width: 3;
}

.hist-follow {
  display: grid;
  grid-template-columns: 22px auto minmax(0, 1fr);
  align-items: center;
  column-gap: 8px;
  min-height: 44px;
  padding: 6px 10px;
  font-size: 0.8125rem;
}

.hist-follow__value {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.hist-follow__label {
  color: var(--text-muted);
}

.hist-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 28px 20px;
  text-align: center;
}

.hist-empty .module__icon {
  background: var(--surface-muted);
  color: var(--text-muted);
}

.hist-empty__text {
  margin: 6px 0 0;
  font-size: var(--fs-md);
  font-weight: 600;
}

.hist-empty__range {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

.hist-empty__back {
  min-height: 40px;
  margin-top: 4px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--red);
}

/* ------------------------------ modules in production (/reports, /users) --- */
.module-status {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 48px 24px 40px;
  text-align: center;
}

.module-status__icon {
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 18px;
  background: var(--red-soft);
  color: var(--red-text);
}

.module-status__icon .icon {
  width: 30px;
  height: 30px;
}

.module-status__title {
  margin: 6px 0 0;
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: 0.06em;
}

.module-status__text {
  margin: 0;
  padding: 6px 14px;
  border-radius: var(--radius-pill);
  background: var(--green-soft);
  color: var(--green-text);
  font-size: var(--fs-md);
  font-weight: 600;
}

.module-status__back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
  margin-top: 8px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--red);
  text-decoration: none;
}

/* -------------------------------------------------------------- toast --- */
.toast {
  position: fixed;
  z-index: 40;
  left: 50%;
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 90px);
  transform: translateX(-50%);
  max-width: calc(min(100vw, var(--app-max)) - 2 * var(--page-x));
  padding: 10px 16px;
  border-radius: var(--radius-pill);
  background: var(--text);
  color: #ffffff;
  font-size: var(--fs-sm);
  font-weight: 500;
  white-space: nowrap;
}

.toast[hidden] {
  display: none;
}

/* ---------------------------------------------------- small screens --- */
@media (max-width: 374px) {
  :root {
    --page-x: 12px;
  }

  .brand__name {
    font-size: 1.375rem;
  }

  .split {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* ------------------------------------------- KPI: won / lost / money --- */
.metric--outcome {
  cursor: default;
}

.metric__foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-height: 20px;
}

.metric__note {
  font-size: 0.625rem;
  color: var(--text-muted);
  white-space: nowrap;
}

.metric__modes {
  display: inline-flex;
  flex: 0 0 auto;
  padding: 1px;
  border-radius: var(--radius-pill);
  background: var(--surface-muted);
}

.metric__mode {
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--text-muted);
  font: inherit;
  font-size: 0.6875rem;
  font-weight: 700;
  cursor: pointer;
}

.metric__mode[aria-pressed='true'] {
  background: var(--bg);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(17, 17, 17, 0.12);
}

.metric--money {
  flex-basis: 128px;
  gap: 4px;
}

.metric__pair {
  display: flex;
  flex-direction: column;
  line-height: 1.1;
}

.metric__key {
  font-size: 0.625rem;
  color: var(--text-muted);
}

.metric__amount {
  font-size: 1rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.metric__pair--won .metric__amount {
  color: var(--green-text);
}

/* ---------------------------------- pipeline: four business categories --- */
.pipeline--overview {
  grid-template-columns: minmax(0, 1fr) auto;
}

.stage--metric {
  min-height: 38px;
}

.stage--metric .stage__label {
  overflow: hidden;
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-overflow: ellipsis;
  text-transform: uppercase;
}

.stage--metric .stage__count {
  font-size: 0.95rem;
  font-weight: 800;
}

/* --------------------------------------- feedback overview & priority --- */
.waiting--offer .rv-wait {
  min-width: 28px;
  height: 20px;
  padding: 0 6px;
  font-size: 0.625rem;
}

.waiting__more {
  font-size: 0.6875rem;
}

.dot--priority-high {
  background: var(--rv-priority-high);
}

.pill--priority-high {
  background: var(--rv-priority-high);
  color: #ffffff;
}

/* LOST: fewer is better, so a rise reads red and a fall green. */
.trend--worse {
  color: var(--red-text);
}

.trend--better {
  color: var(--green-text);
}

/* Dashboard rights (ADR-0014): a widget the member may not see is not on the
   page; a lower row with one widget takes the full width. */
.module[hidden],
.metrics[hidden],
.split[hidden] {
  display: none;
}

.split--single {
  grid-template-columns: minmax(0, 1fr);
}
`,"app/css/components.css":`/* Renvara demo CRM · shared components (drawer, form, buttons, badges, toast).
   Namespaced with rv- so it can load next to the approved dashboard without
   changing it. Values mirror the dashboard tokens in prototypes/home/styles.css. */

:root {
  --rv-red: #e32222;
  --rv-red-hover: #c91c1c;
  --rv-red-text: #c81e1e;
  --rv-red-soft: #fff1f1;
  --rv-red-tint: #fff7f7;
  --rv-green: #12ae55;
  --rv-green-text: #0a8541;
  --rv-green-soft: #eaf8ef;
  --rv-ink: #111111;
  --rv-text-2: #3b3f45;
  --rv-muted: #737982;
  --rv-border: #eceef1;
  --rv-divider: #f0f1f3;
  --rv-field-border: #d5d9e0;
  --rv-field-bg: #f8f9fa;
  --rv-surface-muted: #f6f7f8;
  --rv-bg: #ffffff;
  --rv-font:
    -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Arial, sans-serif;
  --rv-radius: 16px;
  --rv-radius-sm: 10px;
  --rv-radius-field: 12px;
  --rv-shadow-card: 0 1px 2px rgba(17, 17, 17, 0.04), 0 4px 14px rgba(17, 17, 17, 0.04);
  --rv-shadow-drawer: -18px 0 48px rgba(17, 17, 17, 0.16);

  /* Signal colours: Feedback Overview wait (1–4D, 5–9D, 10D+) and task priority. */
  --rv-signal-yellow: #f5c518;
  --rv-signal-yellow-ink: #3d2f00;
  --rv-signal-red: #e32222;
  --rv-signal-black: #111111;
  --rv-priority-low: var(--rv-signal-yellow);
  --rv-priority-low-ink: var(--rv-signal-yellow-ink);
  --rv-priority-medium: var(--rv-signal-red);
  --rv-priority-high: var(--rv-signal-black);
}

html.rv-scroll-lock {
  overflow: hidden;
}

/* ------------------------------------------------------------- icons --- */
.rv-icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.rv-icon--sm {
  width: 15px;
  height: 15px;
}

/* ----------------------------------------------------------- buttons --- */
.rv-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid transparent;
  border-radius: var(--rv-radius-field);
  font-family: var(--rv-font);
  font-size: 15px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
  text-decoration: none;
  cursor: pointer;
  transition:
    transform 0.12s ease,
    background-color 0.15s ease,
    border-color 0.15s ease;
}

.rv-btn:active {
  transform: scale(0.98);
}

.rv-btn:disabled {
  opacity: 0.6;
  cursor: progress;
}

.rv-btn:focus-visible,
.rv-icon-btn:focus-visible,
.rv-link-btn:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: 2px;
}

.rv-btn .rv-icon {
  width: 18px;
  height: 18px;
}

.rv-btn--primary {
  background: var(--rv-red);
  color: #ffffff;
}

.rv-btn--primary:hover {
  background: var(--rv-red-hover);
}

.rv-btn--dark {
  background: var(--rv-ink);
  color: #ffffff;
}

.rv-btn--dark:hover {
  background: #2a2c30;
}

.rv-btn--secondary {
  background: var(--rv-bg);
  border-color: var(--rv-field-border);
  color: var(--rv-ink);
}

.rv-btn--secondary:hover {
  border-color: #b9bec7;
}

.rv-btn--soft {
  min-height: 38px;
  padding: 0 12px;
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
  font-size: 14px;
  font-weight: 600;
}

.rv-btn--soft:hover {
  background: #eceef1;
}

.rv-btn--ghost {
  background: transparent;
  color: var(--rv-muted);
  font-weight: 600;
}

.rv-btn--sm {
  min-height: 36px;
  padding: 0 12px;
  font-size: 13px;
}

.rv-btn--lg {
  min-height: 50px;
  padding: 0 20px;
  border-radius: 14px;
  font-size: 15.5px;
}

.rv-icon-btn {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--rv-text-2);
  cursor: pointer;
}

.rv-icon-btn:hover {
  background: var(--rv-surface-muted);
}

.rv-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 32px;
  margin-left: auto;
  padding: 0 4px;
  border: 0;
  background: transparent;
  color: var(--rv-red);
  font-family: var(--rv-font);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* ------------------------------------------------------------ badges --- */
.rv-badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 0 10px;
  border-radius: var(--rv-radius-sm);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}

.rv-badge--green {
  background: var(--rv-green-soft);
  color: var(--rv-green-text);
}

.rv-badge--red {
  background: var(--rv-red-soft);
  color: var(--rv-red-text);
}

.rv-badge--neutral {
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
}

.rv-badge--inline {
  margin-left: 8px;
  min-height: 20px;
  padding: 0 8px;
  font-size: 11px;
  vertical-align: middle;
}

/* ------------------------------------------------------------ drawer --- */
.rv-drawer-root {
  position: fixed;
  inset: 0;
  z-index: 1000;
  font-family: var(--rv-font);
  color: var(--rv-ink);
}

.rv-drawer-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(17, 17, 17, 0.34);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.rv-drawer {
  position: absolute;
  top: 0;
  right: 0;
  width: min(520px, 100vw);
  height: 100%;
  max-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--rv-bg);
  box-shadow: var(--rv-shadow-drawer);
  transform: translateX(104%);
  transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.rv-drawer-root.is-open .rv-drawer-backdrop {
  opacity: 1;
}

.rv-drawer-root.is-open .rv-drawer {
  transform: none;
}

.rv-drawer__header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 18px) 16px 14px 24px;
  border-bottom: 1px solid var(--rv-divider);
}

.rv-drawer__heading {
  min-width: 0;
  padding-top: 6px;
}

.rv-drawer__title {
  margin: 0;
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.01em;
}

.rv-drawer__subtitle {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--rv-muted);
}

.rv-drawer__form {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-height: 0;
}

.rv-drawer__body {
  flex: 1 1 auto;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 18px 24px 28px;
}

.rv-drawer__footer {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  padding: 14px 24px calc(env(safe-area-inset-bottom, 0px) + 14px);
  border-top: 1px solid var(--rv-divider);
  background: var(--rv-bg);
}

@media (max-width: 520px) {
  .rv-drawer__body,
  .rv-drawer__footer {
    padding-left: 16px;
    padding-right: 16px;
  }

  .rv-drawer__footer .rv-btn {
    flex: 1 1 0;
  }
}

/* -------------------------------------------------------------- form --- */
.rv-form {
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.rv-form__section {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.rv-form__section-title {
  margin: 0;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--rv-muted);
}

.rv-form__grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

}

@media (max-width: 480px) {
  .rv-form__grid {
    grid-template-columns: minmax(0, 1fr);
  }
}

.rv-field {

  flex-direction: column;
  gap: 6px;
  min-width: 0;
}

.rv-field--full {
  grid-column: 1 / -1;
}

.rv-field__label {
  font-size: 13px;
  font-weight: 600;
  color: var(--rv-text-2);
}

.rv-field__req {
  color: var(--rv-red);
}

.rv-input {
  width: 100%;
  min-height: 46px;
  padding: 0 14px;
  border: 1px solid var(--rv-field-border);
  border-radius: var(--rv-radius-field);
  background: var(--rv-field-bg);
  color: var(--rv-ink);
  font-family: var(--rv-font);
  font-size: 15px;
  box-sizing: border-box;
}

textarea.rv-input {
  min-height: 92px;
  padding: 10px 14px;
  line-height: 1.45;
  resize: vertical;
}

select.rv-input {

.rv-confirm-root {

  gap: 16px;
  margin-bottom: 18px;
}

.rv-page-head__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.rv-page-title {
  margin: 0 0 4px;
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.rv-card {
  background: var(--rv-bg);
  border: 1px solid var(--rv-border);
  border-radius: var(--rv-radius);
  box-shadow: var(--rv-shadow-card);
}

.rv-empty {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  padding: 4px 0 6px;
  color: var(--rv-muted);
  font-size: 14px;
}

.rv-empty p {
  margin: 0;
}

.rv-empty--page {
  align-items: center;
  padding: 48px 24px;
  text-align: center;
}

.rv-empty--page h1 {
  margin: 0;
  color: var(--rv-ink);
  font-size: 22px;
}

/* ----------------------------------------------------------- profile --- */
.rv-profile {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.rv-profile-header {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  padding: 24px;
}

.rv-profile-header__identity {
  display: flex;
  gap: 18px;
  flex: 1 1 380px;
  min-width: 0;
}

.rv-company-avatar {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 18px;
  background: var(--rv-red-soft);
  color: var(--rv-red);
  font-size: 22px;
  font-weight: 800;
}

.rv-profile-header__text {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}

.rv-profile-header__title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.rv-profile-header__name {
  margin: 0;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1.1;
  overflow-wrap: anywhere;
}

.rv-profile-header__address {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0;
  color: var(--rv-text-2);
  font-size: 15px;
}

.rv-profile-header__address .rv-icon {
  color: var(--rv-muted);
}

.rv-profile-header__meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 20px;
  margin: 0;
  font-size: 14px;
}

.rv-profile-header__meta div {
  display: flex;
  gap: 5px;
}

.rv-profile-header__meta dt {
  color: var(--rv-muted);
}

.rv-profile-header__meta dd {
  margin: 0;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.rv-profile-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
  flex: 0 1 auto;
}

.rv-profile-actions__primary,
.rv-profile-actions__secondary {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
}

/* Deaktiviraj / Aktiviraj kupca: last, quieter than the CRM actions. */
.rv-profile-actions__lifecycle {
  display: flex;
  justify-content: flex-end;
}

/* Accordion sections, one column (Customer Detail, Zadaci). */
.rv-accordion-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

@media (max-width: 960px) {
  .rv-profile-actions {
    align-items: stretch;
    width: 100%;
  }

  .rv-profile-actions__primary,
  .rv-profile-actions__secondary,
  .rv-profile-actions__lifecycle {
    justify-content: flex-start;
  }
}

/* ----------------------------------------------------------- section --- */
.rv-section__icon {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--rv-red-soft);
  color: var(--rv-red);
}

.rv-section__icon .rv-icon {
  width: 17px;
  height: 17px;
}

.rv-section__title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.01em;
  text-transform: uppercase;
}

.rv-section__count {
  min-width: 24px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
  font-size: 12px;
  font-weight: 700;
  text-align: center;
}

/* Accordion section: the whole header is the toggle; closed = only the header. */
.rv-accordion {
  scroll-margin-top: 120px;
  overflow: hidden;
}

.rv-accordion__heading {
  margin: 0;
}

.rv-accordion__toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 64px;
  padding: 12px 14px 12px 20px;
  border: 0;
  background: none;
  color: var(--rv-ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.rv-accordion__toggle:hover {
  background: var(--rv-surface-muted);
}

.rv-accordion__toggle:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: -2px;
  border-radius: var(--rv-radius);
}

.rv-accordion__toggle .rv-section__title {
  min-width: 0;
  overflow-wrap: anywhere;
}

.rv-accordion__chevron {
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  margin-left: auto;
  border-radius: 10px;
  background: var(--rv-surface-muted);
  color: var(--rv-red);
}

.rv-accordion__chevron .rv-icon {
  stroke-width: 2.4;
  transition: transform 0.24s ease;
}

.rv-accordion.is-open .rv-accordion__chevron .rv-icon {
  transform: rotate(180deg); /* chevron up */
}

/* Height animation without measuring: 0fr → 1fr. */
.rv-accordion__panel {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.24s ease;
}

.rv-accordion.is-open .rv-accordion__panel {
  grid-template-rows: 1fr;
}

.rv-accordion__inner {
  min-height: 0;
  overflow: hidden;
}

.rv-accordion__content {
  padding: 4px 20px 20px;
}

.rv-accordion__content > .rv-empty {
  padding: 8px 0 0;
}

@media (prefers-reduced-motion: reduce) {
  .rv-accordion__panel,
  .rv-accordion__chevron .rv-icon {
    transition: none;
  }
}

.rv-section__summary {
  margin: -4px 0 12px;
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-subtitle {
  margin: 16px 0 8px;
  color: var(--rv-muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.rv-dl {
  display: flex;
  flex-direction: column;
  margin: 0;
}

.rv-dl__row {
  display: grid;
  grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
  gap: 12px;
  padding: 9px 0;
  border-top: 1px solid var(--rv-divider);
  font-size: 14px;
}

.rv-dl__row:first-child {
  border-top: 0;
}

.rv-dl__row dt {
  color: var(--rv-muted);
}

.rv-dl__row dd {
  margin: 0;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.rv-upcoming__item {
  display: flex;
  gap: 10px;
  padding: 10px 0;
  border-top: 1px solid var(--rv-divider);
}

.rv-upcoming__icon {
  width: 32px;
  height: 32px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 10px;
  background: var(--rv-green-soft);
  color: var(--rv-green-text);
}

.rv-upcoming__icon .rv-icon {
  width: 17px;
  height: 17px;
}

.rv-upcoming__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: 14px;
}

.rv-upcoming__text span {
  color: var(--rv-muted);
  font-size: 13px;
}

/* opportunities */
.rv-opps,
.rv-tasks,
.rv-contacts,
.rv-timeline,
.rv-list,
.rv-agenda__list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.rv-opp {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 0;
  border-top: 1px solid var(--rv-divider);
}

.rv-opp:first-child {
  border-top: 0;
  padding-top: 2px;
}

.rv-opp__top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.rv-opp__title {
  font-size: 15px;
}

.rv-opp__value {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.rv-opp__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-opp__notes {
  margin: 0;
  color: var(--rv-text-2);
  font-size: 13px;
}

/* Offers of an opportunity, its reminder and its actions (send offer, won, lost). */
.rv-offers {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
}

.rv-offer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  padding: 8px 10px;
  border-radius: var(--rv-radius-sm);
  background: var(--rv-surface-muted);
  font-size: 13px;
}

.rv-offer > .rv-icon {
  color: var(--rv-red);
}

.rv-offer__text {
  display: flex;
  flex: 1 1 160px;
  flex-direction: column;
  min-width: 0;
}

.rv-offer__link {
  font-size: 13px;
  font-weight: 600;
  color: var(--rv-red-text);
  text-decoration: none;
}

.rv-offer__link strong {
  color: var(--rv-ink);
}

.rv-offer__link:hover strong {
  text-decoration: underline;
}

.rv-offer__text span {
  color: var(--rv-muted);
}

.rv-opp__origin {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 0;
  color: var(--rv-text-2);
  font-size: 13px;
  font-weight: 600;
  text-decoration: none;
}

.rv-opp__origin:hover {
  color: var(--rv-red-text);
}

.rv-opp__reminder {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 0;
  color: var(--rv-text-2);
  font-size: 13px;
}

.rv-opp__reminder.is-failed {
  color: var(--rv-red-text);
}

.rv-opp__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

/* timeline */
.rv-timeline__item {
  position: relative;
  display: flex;
  gap: 14px;
  padding-bottom: 18px;
}

.rv-timeline__item:not(:last-child)::before {
  content: '';
  position: absolute;
  top: 38px;
  bottom: 2px;
  left: 17px;
  width: 2px;
  background: var(--rv-divider);
}

.rv-timeline__icon {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
}

.rv-timeline__icon .rv-icon {
  width: 17px;
  height: 17px;
}

.rv-timeline__icon--red {
  background: var(--rv-red-soft);
  color: var(--rv-red);
}

.rv-timeline__icon--green {
  background: var(--rv-green-soft);
  color: var(--rv-green-text);
}

.rv-timeline__icon--neutral {
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
}

.rv-timeline__body {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  padding-top: 2px;
}

.rv-timeline__title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
}

.rv-timeline__desc {
  margin: 0;
  color: var(--rv-text-2);
  font-size: 14px;
  line-height: 1.45;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.rv-timeline__time {
  margin: 0;
  color: var(--rv-muted);
  font-size: 12.5px;
}

/* tasks */
.rv-task {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  border-top: 1px solid var(--rv-divider);
}

.rv-tasks .rv-task:first-child {
  border-top: 0;
}

.rv-task__check {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

.rv-task__check::before {
  content: '';
  grid-area: 1 / 1;
  width: 24px;
  height: 24px;
  border: 2px solid var(--rv-red);
  border-radius: 50%;
  box-sizing: border-box;
}

.rv-task__check .rv-icon {
  grid-area: 1 / 1;
  width: 14px;
  height: 14px;
  stroke-width: 3.2;
  color: #ffffff;
  opacity: 0;
}

.rv-task__check[aria-pressed='true']::before {
  border-color: var(--rv-green);
  background: var(--rv-green);
}

.rv-task__check[aria-pressed='true'] .rv-icon {
  opacity: 1;
}

.rv-task__check:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: -2px;
}

.rv-task__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.rv-task__title {
  font-size: 14.5px;
  font-weight: 600;
}

.rv-task.is-done .rv-task__title {
  color: var(--rv-muted);
}

.rv-task__meta {
  color: var(--rv-muted);
  font-size: 12.5px;
}

/* contacts */
.rv-contact {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--rv-divider);
}

.rv-contact:first-child {
  border-top: 0;
  padding-top: 2px;
}

.rv-contact__avatar {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
  font-size: 14px;
  font-weight: 700;
}

.rv-contact__text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  font-size: 14px;
}

.rv-contact__role {
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-contact__channels {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  color: var(--rv-text-2);
  font-size: 13px;
}

.rv-contact__channels span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* ------------------------------------------------------ customer list --- */
.rv-list {
  overflow: hidden;
}

.rv-list li + li {
  border-top: 1px solid var(--rv-divider);
}

.rv-list__row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto auto 16px;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  text-decoration: none;
}

.rv-list__row:hover {
  background: var(--rv-surface-muted);
}

.rv-list__icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--rv-red-soft);
  color: var(--rv-red);
}

.rv-list__main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.rv-list__main span,
.rv-list__date {
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-list__chevron {
  width: 16px;
  height: 16px;
  color: #9aa0a8;
}

@media (max-width: 720px) {
  .rv-list__row {
    grid-template-columns: 40px minmax(0, 1fr) auto 16px;
  }

  .rv-list__date {
    display: none;
  }
}

/* Prilike: an opportunity without a next action. */
.rv-list__warn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--rv-red-text) !important;
  font-weight: 600;
}

/* An opportunity's title on its customer or lead: the way to its own page. */
.rv-opp__title-link {
  font-weight: 700;
  text-decoration: none;
}

.rv-opp__title-link:hover {
  color: var(--rv-red-text);
  text-decoration: underline;
}

/* One opportunity on its own page (/sales/opportunities/{id}): its card. */
.rv-opp-page {
  max-width: 880px;
  padding: 18px 22px;
  background: var(--rv-bg);
  border: 1px solid var(--rv-border);
  border-radius: var(--rv-radius);
  box-shadow: var(--rv-shadow-card);
}

.rv-opp-page .rv-opp {
  padding: 0;
}

.rv-opp-page .rv-opp__title {
  font-size: 17px;
}

/* ------------------------------------------- pipeline (accordions) --- */
/* [ Q4 2026 ▾ ] [ + Nova prilika ]: one row, also on a 375px phone (also Ponude). */
.rv-pipeline-actions {
  flex-wrap: nowrap;
  align-items: center;
  max-width: 100%;
  min-width: 0;
}

.rv-pipeline-actions > .rv-btn {
  flex: none;
}

.rv-pipeline-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.rv-board__card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 14px;
  border: 1px solid var(--rv-border);
  border-radius: var(--rv-radius-sm);
  background: var(--rv-surface-muted);
  font-size: 14px;
  text-decoration: none;
}

.rv-board__card:hover {
  border-color: #f3c3c3;
}

.rv-board__customer {
  color: var(--rv-red-text);
  font-size: 13px;
  font-weight: 600;
}

.rv-board__meta,
.rv-board__demo,
.rv-pipeline-empty {
  margin: 0;
  color: var(--rv-muted);
  font-size: 12.5px;
}

.rv-board__demo {
  padding: 10px 4px 0;
}

.rv-pipeline-empty {
  padding: 8px 0 0;
  font-size: 14px;
}

/* ------------------------------------------------------------ agenda --- */
.rv-agenda {
  margin-bottom: 14px;
  padding: 16px 20px 8px;
}

.rv-agenda__day {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 800;
}

.rv-agenda__list li + li {
  border-top: 1px solid var(--rv-divider);
}

.rv-agenda__row {
  display: grid;
  grid-template-columns: 52px 12px minmax(0, 1fr) 16px;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  text-decoration: none;
}

a.rv-agenda__row:hover {
  background: var(--rv-surface-muted);
}

.rv-agenda__time {
  font-variant-numeric: tabular-nums;
  color: var(--rv-text-2);
}

.rv-agenda__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--rv-green);
}

.rv-agenda__dot--demo {
  background: #c9ced6;
}

.rv-agenda__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: 14.5px;
}

.rv-agenda__text span {
  color: var(--rv-muted);
  font-size: 13px;
}

@media (max-width: 720px) {
  .rv-topbar__inner {
    flex-wrap: wrap;
    gap: 8px 12px;
    padding-left: 16px;
    padding-right: 16px;
  }

  .rv-topbar__nav {
    order: 3;
    width: 100%;
    margin-left: 0;
  }

  .rv-topbar__user {
    margin-left: auto;
  }

  .rv-page {
    padding: 16px 16px 48px;
  }

  .rv-profile-header__name {
    font-size: 24px;
  }

  /* Profile header on phones: compact identity, actions as an even grid. */
  .rv-profile-header {
    gap: 18px;
    padding: 18px 16px;
  }

  .rv-profile-header__identity {
    flex-basis: 100%;
    gap: 14px;
  }

  .rv-company-avatar {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    font-size: 18px;
  }

  .rv-profile-header__meta {
    flex-direction: column;
    gap: 3px;
  }

  .rv-profile-actions__primary,
  .rv-profile-actions__secondary {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: 100%;
  }

  .rv-profile-actions__primary .rv-btn:last-child {
    grid-column: 1 / -1;
  }

  .rv-profile-actions .rv-btn {
    width: 100%;
    min-width: 0;
    padding: 0 10px;
    font-size: 14.5px;
  }

  .rv-profile-actions .rv-btn--soft {
    font-size: 13.5px;
  }
}

/* --------------------------------------------- tasks: list and groups --- */
.rv-task {
  grid-template-columns: 44px minmax(0, 1fr);
}

.rv-task__link {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 16px;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  color: inherit;
  text-decoration: none;
}

.rv-task__check:disabled {
  opacity: 0.4;
  cursor: default;
}

.rv-task-group__empty {
  margin: 6px 0 10px;
  font-size: 14px;
}

.rv-search {
  width: 100%;
  margin-bottom: 14px;
}

/* Aktivni | Neaktivni | Svi above the customer search. */
.rv-customer-filter {
  max-width: 420px;
  margin-bottom: 12px;
}

/* Next action of an opportunity (ADR-0004). */
.rv-next-action {
  display: flex;
  align-items: center;

.rv-next-action > span {

}

.rv-next-action--missing {

.rv-board__link {

a.rv-upcoming__item {

/* ----------------------------------------------- calendar: week view --- */
.rv-week-nav {

.rv-week-nav .rv-btn[aria-current='true'] {

.rv-agenda.is-today {

    inset 3px 0 0 var(--rv-red),

.rv-agenda__row {

.rv-agenda__row.is-done strong {

.rv-agenda__dot--red {

.rv-offer-row__title {

.rv-offer-row__dates,
.rv-offer-row__today {

.rv-offer-row__today {

.rv-offer-row__chevron {

/* The offer opened from Feedback overview, marked on the customer's profile. */

}
`,"app/css/screen.css":`/* Renvara · dedicated task screens (mobile navigation push), e.g. /customers/new.
   Mobile first: one column, no bottom navigation, page scrolls with the keyboard. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--rv-bg);
}

body {
  -webkit-tap-highlight-color: transparent;
  color: var(--rv-ink);
  font-family: var(--rv-font);
  -webkit-font-smoothing: antialiased;
}

/* Natural document flow (no fixed-height container) so the virtual keyboard never traps fields. */
.rv-screen {
  min-height: 100vh;
  animation: rv-push-in 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes rv-push-in {
  from {
    opacity: 0;
    transform: translateX(28px);
  }
}

.rv-screen__header {
  position: sticky;
  top: 0;
  z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rv-border);
}

.rv-screen__header-inner {
  display: flex;
  align-items: center;
  gap: 4px;
  max-width: 560px;
  min-height: 56px;
  margin: 0 auto;
  padding: 0 8px;
}

.rv-screen__back {
  color: var(--rv-ink);
}

.rv-screen__back .rv-icon {
  width: 26px;
  height: 26px;
}

.rv-screen__back:disabled {
  opacity: 0.4;
}

.rv-screen__title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.rv-screen__title:focus {
  outline: none;
}

.rv-screen__body {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
}

/* Mobile-sized controls: 16px text avoids iOS zoom-on-focus; ≥48px touch height. */
.rv-screen .rv-form {
  gap: 28px;
}

.rv-screen .rv-form__section-title {
  font-size: 12px;
}

.rv-screen .rv-field__label {
  font-size: 14px;
}

.rv-screen .rv-input {
  min-height: 48px;
  font-size: 16px;
}

.rv-screen .rv-field {
  scroll-margin: 88px 0 120px;
}

.rv-screen__error {
  margin: 20px 0 0;
  padding: 12px 14px;
  border-radius: var(--rv-radius-field);
  background: var(--rv-red-soft);
  color: var(--rv-red-text);
  font-size: 14px;
  font-weight: 600;
}

.rv-screen__error[hidden] {
  display: none;
}

.rv-screen__actions {
  display: flex;
  gap: 10px;
  margin-top: 28px;
}

.rv-screen__actions .rv-btn {
  min-height: 52px;
  border-radius: 14px;
  font-size: 15px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.rv-screen__actions .rv-btn--secondary {
  flex: 1 1 0;
}

.rv-screen__actions .rv-btn--primary {
  flex: 2 1 0;
}

@media (prefers-reduced-motion: reduce) {
  .rv-screen {
    animation: none;
  }
}

.rv-screen__loading {
  color: var(--rv-muted);
}

/* Time pickers side by side on the task screen. */
.rv-screen .rv-form__grid:has(> [data-field='startTime']) {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.rv-screen .rv-form__grid:has(> [data-field='startTime']) > :not([data-field$='Time']) {
  grid-column: 1 / -1;
}

/* Task detail */
.rv-task-detail {
  padding: 18px 18px 8px;
}

.rv-task-detail__badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.rv-task-detail__title {
  margin: 12px 0 8px;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.rv-task-detail .rv-dl a {
  color: var(--rv-red-text);
  font-weight: 600;
}

.rv-screen__actions--stack {
  flex-direction: column;
}

.rv-screen__actions--stack .rv-btn {
  width: 100%;
}
