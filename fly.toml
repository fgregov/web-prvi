# Renvara on Fly.io: one machine, records on a volume, HTTPS at
# https://<app>.fly.dev. Steps and secrets: deploy/README.md.
app = 'renvara-beta'
primary_region = 'fra'

[build]
  dockerfile = 'apps/beta-web/Dockerfile'
  [build.args]
    RENVARA_EDITION = 'clean'

[env]
  RENVARA_TRUST_PROXY = 'true'
  RENVARA_ORG_TIMEZONE = 'Europe/Zagreb'

[[mounts]]
  source = 'renvara_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: the server itself sends reminders and notifications on time.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/login'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
