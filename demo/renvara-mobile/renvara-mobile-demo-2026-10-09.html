<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Renvara Mobile Demo</title>
<meta name="theme-color" content="#ffffff" />
<style id="rv-shell-css">
  /* Renvara demo shell. The app is light-only by design (see prototypes/home). */
  :root {
    color-scheme: light;
    --rv-demo-bg: #ffffff;
    --rv-demo-muted: #737982;
    --rv-demo-note-bg: #fff1f1;
    --rv-demo-note-ink: #c81e1e;
  }
  body {
    background: var(--rv-demo-bg);
  }
  #rv-root:empty::before {
    content: 'Učitavanje Renvare…';
    display: block;
    padding: 48px 16px;
    color: var(--rv-demo-muted);
    font:
      15px -apple-system,
      BlinkMacSystemFont,
      'Segoe UI',
      Arial,
      sans-serif;
    text-align: center;
  }
  .intro .demo-note {
    margin: 12px 0 0;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--rv-demo-note-bg);
    color: var(--rv-demo-note-ink);
    font-size: 13px;
    line-height: 1.4;
  }
</style>
<div id="rv-root"></div>
<!-- Phone frame for the mobile demo build (node demo/build.ts --mobile).
     On a wide screen with a mouse, the app runs inside a phone-sized frame
     (an iframe with the same page, so its own mobile layout applies) next to
     a short guide. Phones and tablets get the app full screen, as before.
     If the frame does not start, the app runs directly in this page. -->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
/>
<style>
  /* Layout: guide on the left, the phone on the right; stacked when narrow. */
  :root {
    --stage-bg: #f3f1ef;
    --stage-ink: #17181b;
    --stage-muted: #575c66;
    --stage-accent: #d91f1f;
    --stage-line: #e2ddd9;
    --stage-button: #ffffff;
    --phone-body: #121316;
    --phone-edge: #34363c;
    --phone-shadow: rgb(23 24 27 / 0.28);
    --stage-font: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root.rv-framed:not([data-theme='light']) {
      --stage-bg: #121315;
      --stage-ink: #f1f1f3;
      --stage-muted: #a6aab3;
      --stage-accent: #ff5d52;
      --stage-line: #2b2d32;
      --stage-button: #1c1e22;
      --phone-body: #050506;
      --phone-edge: #43464e;
      --phone-shadow: rgb(0 0 0 / 0.6);
      color-scheme: dark;
    }
  }
  :root.rv-framed[data-theme='dark'] {
    --stage-bg: #121315;
    --stage-ink: #f1f1f3;
    --stage-muted: #a6aab3;
    --stage-accent: #ff5d52;
    --stage-line: #2b2d32;
    --stage-button: #1c1e22;
    --phone-body: #050506;
    --phone-edge: #43464e;
    --phone-shadow: rgb(0 0 0 / 0.6);
    color-scheme: dark;
  }
  :root.rv-framed body {
    background: var(--stage-bg);
    color: var(--stage-ink);
  }
  :root.rv-framed #rv-root {
    display: none;
  }
  .rv-stage {
    --s: 1;
    box-sizing: border-box;
    min-height: 100vh;
    padding: 32px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 32px 64px;
    font-family: var(--stage-font);
  }
  .rv-guide {
    flex: 0 1 340px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .rv-guide__brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.02em;
  }
  .rv-guide__brand img {
    width: 36px;
    height: 36px;
    object-fit: contain;
  }
  .rv-guide h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.15;
    font-weight: 800;
    text-wrap: balance;
  }
  .rv-guide p {
    margin: 0;
    color: var(--stage-muted);
    font-size: 15px;
    line-height: 1.55;
  }
  .rv-guide h2 {
    margin: 0 0 8px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stage-muted);
  }
  .rv-guide ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 14px;
    line-height: 1.45;
  }
  .rv-guide li {
    padding-left: 16px;
    position: relative;
  }
  .rv-guide li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0.6em;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--stage-accent);
  }
  .rv-guide__note {
    padding-top: 16px;
    border-top: 1px solid var(--stage-line);
    font-size: 13px;
  }
  .rv-guide__actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .rv-guide__actions button {
    font: 600 14px var(--stage-font);
    color: var(--stage-ink);
    background: var(--stage-button);
    border: 1px solid var(--stage-line);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
  }
  .rv-guide__actions button:hover {
    border-color: var(--stage-muted);
  }
  .rv-guide__actions button:focus-visible {
    outline: 2px solid var(--stage-accent);
    outline-offset: 2px;
  }
  /* Stacked (too narrow for side by side): the phone first. */
  @media (max-width: 879px) {
    .rv-phone-slot {
      order: -1;
    }
  }
  .rv-phone-slot {
    flex: none;
    width: calc(414px * var(--s));
    height: calc(868px * var(--s));
  }
  .rv-phone {
    box-sizing: border-box;
    width: 414px;
    height: 868px;
    padding: 12px;
    border-radius: 58px;
    background: var(--phone-body);
    box-shadow:
      0 0 0 2px var(--phone-edge),
      0 36px 70px -24px var(--phone-shadow);
    transform: scale(var(--s));
    transform-origin: top left;
  }
  .rv-phone__screen {
    width: 390px;
    height: 844px;
    border-radius: 46px;
    overflow: hidden;
    background: #ffffff;
  }
  .rv-phone iframe {
    display: block;
    width: 390px;
    height: 844px;
    border: 0;
  }
</style>
<script>
  (() => {
    const wide = matchMedia(
      '(min-width: 760px) and (min-height: 560px) and (hover: hover) and (pointer: fine)',
    ).matches;
    if (!wide) return;
    window.__rvFramed = true;
    document.documentElement.classList.add('rv-framed');

    const KEYS = [
      'renvara.demo.crm.v1',
      'renvara.demo.auth',
      'renvara.demo.nav',
      'renvara.dashboard.period',
    ];
    const forget = () => {
      for (const store of ['localStorage', 'sessionStorage']) {
        try {
          for (const key of KEYS) window[store].removeItem(key);
        } catch {
          /* storage blocked: the app keeps its data in memory only */
        }
      }
    };

    function mount() {
      const app = document.getElementById('rv-app')?.textContent ?? '';
      const shellCss = document.getElementById('rv-shell-css')?.textContent ?? '';
      // The same page for the frame, with the reset the artifact host adds around it.
      const page =
        '<!doctype html><html lang="hr"><head><meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">' +
        '<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,-apple-system,sans-serif}' +
        'img{max-width:100%}[hidden]{display:none!important}' +
        shellCss +
        '</style></head><body><div id="rv-root"></div><script>' +
        app +
        '<\/script><script>const rvWait=setInterval(()=>{if(document.getElementById("rv-root").children.length){clearInterval(rvWait);parent.postMessage({rvFrame:"ready"},"*")}},100)<\/script></body></html>';

      const stage = document.createElement('main');
      stage.className = 'rv-stage';
      stage.innerHTML = document.getElementById('rv-frame-guide').innerHTML;
      const screen = stage.querySelector('.rv-phone__screen');
      let frame = null;
      /** A fresh frame: a new app start (same as reopening the page). */
      const open = () => {
        const next = document.createElement('iframe');
        next.title = 'Renvara, mobilna aplikacija';
        next.srcdoc = page;
        if (frame) frame.replaceWith(next);
        else screen.append(next);
        frame = next;
      };
      document.body.prepend(stage);

      const fit = () => {
        const s = Math.max(0.5, Math.min(1, (innerHeight - 64) / 868, (innerWidth - 48) / 414));
        stage.style.setProperty('--s', s.toFixed(3));
      };
      fit();
      addEventListener('resize', fit);

      let started = false;
      addEventListener('message', (event) => {
        if (event.source === frame.contentWindow && event.data?.rvFrame === 'ready') started = true;
      });

      /** The app directly in this page (no frame): the fallback, and "full window". */
      const unframe = () => {
        stage.remove();
        removeEventListener('resize', fit);
        document.documentElement.classList.remove('rv-framed');
        window.__rvFramed = false;
        const script = document.createElement('script');
        script.textContent = app;
        document.body.append(script);
      };
      setTimeout(() => {
        if (!started) unframe();
      }, 8000);

      stage.querySelector('[data-action="restart"]').addEventListener('click', () => {
        forget();
        open();
      });
      stage.querySelector('[data-action="unframe"]').addEventListener('click', () => {
        started = true;
        unframe();
      });
      open();
    }
    document.addEventListener('DOMContentLoaded', mount);
  })();
</script>

    <h1 id="rv-guide-title">Mobilni demo</h1>
    <p>
      Renvara kakvu vide prodajni timovi na mobitelu: Sales Kalendar, prioriteti, leadovi, prilike,
      ponude i podsjetnici, s primjerima podataka.
    </p>
    <div>
      <h2>Isprobajte</h2>
      <ul>
        <li>
          Početna: kartice WON i LOST prebacite s # na %, Feedback overview pokazuje koliko dana
          ponuda čeka.
        </li>
        <li>„+” → Novi lead, uz „Označi kao Prospect”.</li>
        <li>Kupci → Initium → Prilike: Ponuda poslana, Dobiveno, Izgubljeno.</li>
        <li>Lead → Dodaj zadatak, s podsjetnikom.</li>
        <li>Odaberite prošli kvartal za povijesni pregled.</li>
      </ul>
    </div>
    <p class="rv-guide__note">
      Prijava prihvaća bilo koje korisničko ime i lozinku. Promjene ostaju samo u ovom pregledniku i
      svaki dan se vraćaju na primjere. Push podsjetnici se u demou spremaju, ali ne stižu na
      uređaj. Na mobitelu otvorite istu poveznicu za prikaz preko cijelog zaslona.
    </p>
    <div class="rv-guide__actions">
      <button type="button" data-action="restart">Vrati demo na početak</button>
      <button type="button" data-action="unframe">Prikaži preko cijelog prozora</button>
    </div>

      <main class="signin">
        <div class="intro">
          <h1>Dobro došli natrag</h1>
          <p>Prijavite se i pogledajte što slijedi.</p>
<p class="demo-note">Demo: prijava prihvaća bilo koje korisničko ime i lozinku. Podaci se spremaju samo u ovom pregledniku.</p>
        </div>

        <form id="login-form" class="form" novalidate>
          <div class="field-group">
            <label class="label" for="login-username">Korisničko ime</label>
            <input
              class="input"
              id="login-username"
              name="username"
              value="demo"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              maxlength="128"
              placeholder="Vaše korisničko ime"
              required
              aria-describedby="login-message"
            />
          </div>

          <div class="field-group">
            <label class="label" for="login-password">Lozinka</label>
            <div class="password">
              <input
                class="password__input"
                id="login-password"
                name="password"
                type="password"
                autocomplete="current-password"
                maxlength="512"
                placeholder="Vaša lozinka"
                required
                aria-describedby="login-message"
              value="demo" />
              <button
                class="password__toggle"
                id="password-toggle"
                type="button"
                aria-label="Prikaži lozinku"
                aria-pressed="false"
              >
                <svg class="icon icon--show" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.5 12S6 5 12 5s9.5 7 9.5 7-3.5 7-9.5 7S2.5 12 2.5 12z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon icon--hide" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18"></path>
                  <path
                    d="M10.6 5.1A10 10 0 0 1 12 5c6 0 9.5 7 9.5 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2.5 12S6 19 12 19a9.6 9.6 0 0 0 5.4-1.6"
                  ></path>
                  <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="forgot">
            <button class="text-button" type="button" data-unavailable>
              Zaboravljena lozinka?
            </button>
          </div>

          <p class="form-message" id="login-message" role="alert" aria-live="assertive" hidden></p>

          <button class="primary" id="login-submit" type="submit">Prijava</button>
        </form>

        <div class="divider" aria-hidden="true">
          <span class="divider__line"></span>
          <span class="divider__text">ili</span>
          <span class="divider__line"></span>
        </div>

        <div class="socials">
          <button class="social social--apple" type="button" data-unavailable>
            <svg class="social__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M16.4 12.6c0-2.4 2-3.6 2.1-3.7-1.1-1.7-2.9-1.9-3.5-1.9-1.5-.2-2.9.9-3.7.9-.8 0-1.9-.8-3.2-.8-1.6 0-3.1 1-4 2.4-1.7 3-.4 7.3 1.2 9.7.8 1.2 1.7 2.5 3 2.4 1.2 0 1.7-.8 3.1-.8 1.5 0 1.9.8 3.2.8 1.3 0 2.2-1.2 3-2.4.9-1.4 1.3-2.7 1.3-2.8 0 0-2.5-1-2.5-3.8zM14 5.3c.7-.8 1.1-1.9 1-3-1 0-2.1.7-2.8 1.5-.6.7-1.2 1.8-1 2.9 1.1.1 2.1-.6 2.8-1.4z"
              ></path>
            </svg>
            Nastavi s Appleom
          </button>
          <button class="social social--google" type="button" data-unavailable>
            <svg class="social__icon social__icon--stroke" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.5 12.2c0-.7-.1-1.3-.2-1.9H12v3.6h4.8a4.3 4.3 0 0 1-1.8 2.7"></path>
              <path d="M15 16.6A7.6 7.6 0 0 1 4.6 13"></path>
              <path d="M4.6 13a7.6 7.6 0 0 1 0-2.2"></path>
              <path d="M4.6 10.8A7.6 7.6 0 0 1 16.9 7"></path>
            </svg>
            Nastavi s Googleom
          </button>
        </div>

        <div class="spacer"></div>
        <p class="footer">
          Novi ste u Renvari?
          <button class="text-button text-button--inline" type="button" data-unavailable>
            Izradite račun
          </button>
        </p>
      </main>

    <main id="app" class="rv-page"></main>`,scripts:[{kind:`module`,src:`app/js/pages/tasks.js`}]}},Ss={"login/login.css":`/* Renvara BETA · Prijava — the approved white sign-in design, unchanged in layout. */
:root {
  --red: #c42127;
  --red-text: #a81b20;
  --ink: #14161a;
  --label: #3f4450;
  --muted: #5b616e;
  --field-border: #d5d9e0;
  --field-bg: #f8f9fa;
  --line: #e3e5ea;
  --bg: #ffffff;
  --font: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--bg);
}

body {
  font-family: var(--font);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

button,
input {
  font-family: inherit;
}

input::placeholder {
  color: #8a909c;
}

.page {
  max-width: 430px;
  min-height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding: calc(env(safe-area-inset-top, 0px) + 40px) 24px
    calc(env(safe-area-inset-bottom, 0px) + 28px);
}

/* Brand */
.brand {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.brand__logo {
  display: block;
  width: auto;
  height: 94px;
  margin: 19px 0 15px;
}

.brand__name {
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.32em;
  padding-left: 0.32em;
  color: var(--red);
}

/* Sign in */
.signin {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding-top: 28px;
}

.intro {
  display: flex;
  flex-direction: column;
  gap: 6px;
  text-align: center;
}

.intro h1 {
  margin: 0;
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.02em;
}

.intro p {
  margin: 0;
  font-size: 15px;
  color: var(--muted);
}

.form {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.field-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.label {
  font-size: 13px;
  font-weight: 700;
  color: var(--label);
}

.input,
.password {
  height: 50px;
  border-radius: 14px;
  border: 1px solid var(--field-border);
  background: var(--field-bg);
}

.input {
  width: 100%;
  padding: 0 16px;
  font-size: 16px;
  color: var(--ink);
  outline-color: var(--red);
}

.password {
  display: flex;
  align-items: center;
  padding: 0 4px 0 16px;
}

.password:focus-within {
  outline: 2px solid var(--red);
  outline-offset: 1px;
}

.password__input {
  flex: 1 1 auto;
  min-width: 0;
  height: 44px;
  border: 0;
  background: transparent;
  font-size: 16px;
  color: var(--ink);
  outline: none;
}

.password__toggle {
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.icon {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.password__toggle .icon--hide,
.password__toggle[aria-pressed='true'] .icon--show {
  display: none;
}

.password__toggle[aria-pressed='true'] .icon--hide {
  display: block;
}

[aria-invalid='true'].input,
.password:has([aria-invalid='true']) {
  border-color: var(--red);
}

.forgot {
  display: flex;
  justify-content: flex-end;
  margin-top: -4px;
}

.text-button {
  height: 44px;
  padding: 0 4px;
  border: 0;
  background: transparent;
  color: var(--red-text);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.text-button--inline {
  height: auto;
  min-height: 24px;
  padding: 0;
  font-size: inherit;
}

.form-message {
  margin: -2px 0 0;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  color: var(--red-text);
  text-align: center;
}

.form-message[data-kind='info'] {
  color: var(--muted);
}

.form-message[hidden] {
  display: none;
}

.primary {
  height: 52px;
  border: 0;
  border-radius: 14px;
  background: var(--red);
  color: #ffffff;
  font-size: 16px;
  font-weight: 700;
  margin-top: -6px;
  cursor: pointer;
}

.primary:disabled {
  cursor: progress;
  opacity: 0.75;
}

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
}

.divider__line {
  flex: 1 1 auto;
  height: 1px;
  background: var(--line);
}

.divider__text {
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
}

.socials {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.social {
  height: 50px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}

.social--apple {
  border: 0;
  background: var(--ink);
  color: #ffffff;
}

.social--google {
  border: 1px solid var(--field-border);
  background: var(--bg);
  color: var(--ink);
}

.social__icon {
  width: 18px;
  height: 18px;
  fill: currentColor;
}

.social__icon--stroke {
  fill: none;
  stroke: currentColor;
  stroke-width: 2.2;
  stroke-linecap: round;
}

.spacer {
  flex: 1 1 auto;
}

.footer {
  margin: 0;
  text-align: center;
  font-size: 14px;
  color: var(--muted);
}

.text-button:focus-visible,
.primary:focus-visible,
.social:focus-visible,
.password__toggle:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
}
`,"home/styles.css":`/* =============================================================================
   Renvara · Mobile home / dashboard
   Reference-faithful implementation. Light theme only (by specification).
   ========================================================================== */

:root {
  /* Color */
  --bg: #ffffff;
  --text: #111111;
  --text-muted: #737982;
  --red: #e32222;
  --red-text: #c81e1e; /* red on tinted backgrounds, keeps AA contrast */
  --red-soft: #fff1f1;
  --red-tint: #fff7f7;
  --green: #12ae55;
  --green-text: #0a8541; /* green used as text, keeps AA contrast */
  --green-soft: #eaf8ef;
  --gray-dot: #a3a8b0;
  --border: #eceef1;
  --surface-muted: #f6f7f8;
  --divider: #f0f1f3;

  --bar-track: #eef0f2;
  --bar-new: #d3d7dc;
  --bar-progress: #f08585;
  --bar-offer: #f8c0c0;
  --bar-negotiation: #a9dfbb;
  --bar-closing: #12ae55;

  /* Typography */
  --font:
    -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Inter', Arial, sans-serif;
  --fs-xs: 0.6875rem; /* 11 */
  --fs-sm: 0.8125rem; /* 13 */
  --fs-md: 0.9375rem; /* 15 */
  --fs-lg: 1.25rem; /* 20 */
  --fs-xl: 1.625rem; /* 26 */

  /* Spacing */
  --page-x: 16px;
  --gap: 12px;
  --gap-sm: 8px;
  --gap-lg: 16px;

  /* Shape & depth */
  --radius: 16px;
  --radius-sm: 10px;
  --radius-pill: 999px;
  --shadow-card: 0 1px 2px rgba(17, 17, 17, 0.04), 0 4px 14px rgba(17, 17, 17, 0.04);
  --shadow-fab: 0 6px 16px rgba(227, 34, 34, 0.35), 0 2px 4px rgba(17, 17, 17, 0.12);
  --shadow-menu: 0 12px 32px rgba(17, 17, 17, 0.14), 0 2px 6px rgba(17, 17, 17, 0.06);

  /* Layout */
  --app-max: 430px;
  --tabbar-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

/* ---------------------------------------------------------------- base --- */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
  background: var(--bg);
}

body {
  margin: 0;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  text-align: inherit;
}

a {
  color: inherit;
  text-decoration: none;
}

:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
  border-radius: 8px;
}

.sprite {
  display: none;
}

.icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon--filled {
  fill: currentColor;
  stroke: none;
}

/* ------------------------------------------------------------- shell --- */
.app {
  position: relative;
  max-width: var(--app-max);
  min-height: 100dvh;
  margin: 0 auto;
  background: var(--bg);
}

.content {
  display: flex;
  flex-direction: column;
  gap: var(--gap-lg);
  padding: 4px var(--page-x) calc(var(--tabbar-h) + var(--safe-bottom) + 88px);
}

/* ------------------------------------------------------------ header --- */
.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap);
  padding: calc(env(safe-area-inset-top, 0px) + 18px) var(--page-x) 16px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
}

.brand__logo {
  width: 44px;
  height: auto;
  flex: 0 0 auto;
}

.brand__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.brand__name {
  font-size: var(--fs-xl);
  font-weight: 800;
  letter-spacing: 0.02em;
  line-height: 1.05;
}

.brand__date {
  font-size: var(--fs-sm);
  color: var(--text-muted);
  white-space: nowrap;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 0 0 auto;
}

.icon-button {
  position: relative;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.bell .icon {
  width: 26px;
  height: 26px;
  stroke-width: 1.9;
}

.bell__dot {
  position: absolute;
  top: 9px;
  right: 10px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  box-shadow: 0 0 0 2px var(--bg);
}

.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--border);
  background: var(--surface-muted);
}

.account {
  position: relative;
}

.account-menu {
  position: absolute;
  z-index: 35;
  top: calc(100% + 8px);
  right: 0;
  display: flex;
  flex-direction: column;
  min-width: 200px;
  padding: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-menu);
  transform-origin: top right;
  animation: menu-in 0.16s ease-out;
}

.account-menu[hidden] {
  display: none;
}

.account-menu__name {
  margin: 0;
  padding: 8px 12px 6px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--text-muted);
}

.account-menu button {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  padding: 0 12px;
  border-radius: var(--radius-sm);
  font-size: var(--fs-md);
  font-weight: 500;
}

.account-menu button:hover,
.account-menu button:focus-visible {
  background: var(--red-soft);
}

.account-menu .icon {
  color: var(--red);
}

.avatar img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* ----------------------------------------------------------- metrics --- */
.metrics {
  display: flex;
  gap: var(--gap-sm);
  margin: 0 calc(var(--page-x) * -1);
  padding: 2px var(--page-x) 6px;
  overflow-x: auto;
  scroll-snap-type: x proximity;
  scroll-padding-inline: var(--page-x);
  scrollbar-width: none;
}

.metrics::-webkit-scrollbar {
  display: none;
}

.metric {
  position: relative;
  flex: 0 0 106px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 12px 10px 12px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  scroll-snap-align: start;
  transition: transform 0.12s ease;
}

.metric:active {
  transform: scale(0.98);
}

.metric__label {
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--text-muted);
  white-space: nowrap;
}

.metric__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 4px;
  min-height: 32px;
}

.metric__value {
  font-size: 1.375rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  line-height: 1;
  white-space: nowrap;
}

.metric__icon {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  flex: 0 0 auto;
}

.metric__icon .icon {
  width: 17px;
  height: 17px;
}

.metric__icon--red {
  background: var(--red-soft);
  color: var(--red);
}

.metric__icon--green {
  background: var(--green-soft);
  color: var(--green);
}

.metric__icon--plain {
  position: absolute;
  top: 8px;
  right: 6px;
  width: 24px;
  height: 24px;
  color: var(--green);
}

.metric__icon--plain .icon {
  stroke-width: 3;
}

.trend {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--green-text);
}

.trend .icon {
  width: 14px;
  height: 14px;
  stroke-width: 2.4;
}

/* ------------------------------------------------------ module cards --- */
.card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}

.module__head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  background: var(--red-tint);
  border-bottom: 1px solid var(--divider);
}

.module__icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: var(--radius-sm);
  background: var(--red-soft);
  color: var(--red);
}

.module__title {
  flex: 1 1 auto;
  min-width: 0;
  margin: 0;
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: 0.01em;
  text-transform: uppercase;
  line-height: 1.1;
}

.module__link {
  display: inline-flex;
  align-items: center;
  gap: 1px;
  flex: 0 0 auto;
  min-height: 32px;
  font-size: var(--fs-sm);
  font-weight: 500;
  color: var(--red);
  white-space: nowrap;
}

.module__link .icon {
  width: 15px;
  height: 15px;
  stroke-width: 2.2;
}

.list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.list > li + li {
  border-top: 1px solid var(--divider);
}

.chevron {
  width: 18px;
  height: 18px;
  color: #9aa0a8;
}

/* DANAS rows */
.event {
  width: 100%;
  min-height: 60px;
  display: grid;
  grid-template-columns: 48px 10px minmax(0, 1fr) 18px;
  align-items: center;
  column-gap: 12px;
  padding: 10px 14px;
}

.event:active,
.stage:active,
.waiting:active {
  background: var(--surface-muted);
}

.event__time {
  font-size: var(--fs-md);
  font-variant-numeric: tabular-nums;
  color: #3b3f45;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
}

.dot--green {
  background: var(--green);
}

.dot--red {
  background: var(--red);
}

.dot--gray {
  background: var(--gray-dot);
}

.event__text,
.waiting__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.event__title {
  font-size: var(--fs-md);
  font-weight: 600;
  line-height: 1.25;
}

.event__sub {
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

.event__time--all-day {
  font-size: var(--fs-xs);
  line-height: 1.2;
}

/* Completed calendar entry: green check instead of the dot, stays visible as history. */
.event__done {
  width: 18px;
  height: 18px;
  margin-left: -4px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--green);
  color: #ffffff;
}

.event__done .icon {
  width: 12px;
  height: 12px;
  stroke-width: 3.4;
}

.event--done .event__title {
  color: var(--text-muted);
}

.empty-row {
  padding: 16px 14px;
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

/* PRIORITETI rows */
.task {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 8px;
  padding: 6px 14px 6px 8px;
  min-height: 56px;
}

.task__check {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
}

.task__check::before {
  content: '';
  grid-area: 1 / 1;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--red);
  background: var(--bg);
  transition:
    background 0.15s ease,
    border-color 0.15s ease;
}

.task__check .icon {
  grid-area: 1 / 1;
  width: 15px;
  height: 15px;
  stroke-width: 3.2;
  color: #ffffff;
  opacity: 0;
  transition: opacity 0.15s ease;
}

.task__check[aria-pressed='true']::before {
  background: var(--green);
  border-color: var(--green);
}

.task__check[aria-pressed='true'] .icon {
  opacity: 1;
}

.task__title {
  font-size: var(--fs-md);
  line-height: 1.3;
}

.pill {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  font-size: 0.75rem;
  font-weight: 500;
  white-space: nowrap;
}

.pill--red {
  background: var(--red-soft);
  color: var(--red-text);
}

.pill--green {
  background: var(--green-soft);
  color: var(--green-text);
}

/* ------------------------------------------------ lower two columns --- */
.split {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  align-items: start;
}

.module--compact {
  container-type: inline-size;
}

.module--compact .module__head {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 6px;
  padding: 10px 8px 6px 10px;
  background: var(--bg);
  border-bottom: 0;
}

.module--compact .module__icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
}

.module--compact .module__icon .icon {
  width: 17px;
  height: 17px;
}

.module--compact .module__title {
  font-size: 0.75rem;
  font-weight: 800;
  letter-spacing: -0.01em;
  line-height: 1.15;
}

.module--compact .module__link {
  font-size: 0.6875rem;
  min-height: 24px;
}

.module--compact .module__link .icon {
  width: 13px;
  height: 13px;
}

@container (max-width: 199px) {
  .module--compact .module__head {
    grid-template-columns: auto minmax(0, 1fr);
    row-gap: 0;
  }

  .module--compact .module__link {
    grid-column: 1 / -1;
    justify-self: end;
    min-height: 20px;
    margin-top: -2px;
  }
}

/* Pipeline: one shared grid so bars line up across rows */
.pipeline {
  display: grid;
  grid-template-columns: max-content minmax(20px, 1fr) 20px;
  margin: 0;
  padding: 0 0 6px;
  list-style: none;
}

.pipeline > li {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
}

.stage {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  align-items: center;
  column-gap: 8px;
  min-height: 36px;
  padding: 0 10px;
}

.stage__label {
  font-size: 0.78rem;
  white-space: nowrap;
}

.stage__track {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--bar-track);
  overflow: hidden;
}

.stage__fill {
  display: block;
  width: var(--fill);
  height: 100%;
  border-radius: inherit;
  background: var(--bar);
}

.stage__count {
  font-size: 0.78rem;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

/* Čekaš odgovor */
.module--compact .list > li + li {
  border-top: 1px solid var(--divider);
}

.waiting {
  width: 100%;
  min-height: 52px;
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) auto 10px;
  align-items: center;
  column-gap: 5px;
  padding: 8px 6px 8px 8px;
}

.waiting__icon {
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 7px;
  background: var(--surface-muted);
  color: #8a9099;
}

.waiting__icon .icon {
  width: 15px;
  height: 15px;
}

.waiting__name {
  font-size: 0.78rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.waiting__sub {
  font-size: 0.625rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.waiting__days {
  font-size: 0.6875rem;
  font-weight: 500;
  color: var(--red-text);
  white-space: nowrap;
}

.waiting .chevron {
  width: 10px;
  height: 10px;
}

/* ---------------------------------------------------------- quick add --- */
.quick-add {
  position: fixed;
  z-index: 30;
  right: max(var(--page-x), calc((100vw - var(--app-max)) / 2 + var(--page-x)));
  bottom: calc(var(--tabbar-h) + var(--safe-bottom) + 14px);
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 12px;
}

.fab {
  width: 60px;
  height: 60px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--red);
  color: #ffffff;
  box-shadow: var(--shadow-fab);
  transition: transform 0.18s ease;
}

.fab .icon {
  width: 28px;
  height: 28px;
  stroke-width: 2.4;
}

.fab[aria-expanded='true'] {
  transform: rotate(45deg);
}

/* The Quick Add sheet itself: .rv-sheet / .rv-quick-add in /app/css/components.css. */

/* ------------------------------------------------------------- tabbar --- */
.tabbar {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: 0;
  transform: translateX(-50%);
  width: min(100%, var(--app-max));
  height: calc(var(--tabbar-h) + var(--safe-bottom));
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  padding: 6px 4px var(--safe-bottom);
  background: var(--bg);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 16px rgba(17, 17, 17, 0.04);
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 48px;
  font-size: var(--fs-xs);
  font-weight: 500;
  color: #7c828b;
}

.tab .icon {
  width: 25px;
  height: 25px;
  stroke-width: 1.8;
}

.tab.is-active {
  color: var(--red);
  font-weight: 600;
}

.tab__label {
  text-align: center;
  line-height: 1.15;
}

/* "Follow-up / Engine": two compact lines, same size as the other labels. */
.tab--two-line {
  gap: 2px;
}

.tab--two-line .icon {
  width: 23px;
  height: 23px;
}

/* -------------------------------------------------------- period bar --- */
.period {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: -6px;
}

.period__row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--gap-sm);
  min-width: 0;
}

.period__trigger {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  min-height: 40px;
  margin-left: -2px;
  padding: 0 6px 0 2px;
  border-radius: var(--radius-sm);
}

.period__trigger:active {
  background: var(--surface-muted);
}

.period__title {
  font-size: var(--fs-lg);
  font-weight: 800;
  letter-spacing: -0.01em;
}

.period__chevron {
  width: 20px;
  height: 20px;
  color: var(--red);
  stroke-width: 2.4;
}

.period__state {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  background: var(--surface-muted);
  color: var(--text-muted);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
}

.period__state .icon {
  width: 13px;
  height: 13px;
}

.period__state--live {
  background: var(--green-soft);
  color: var(--green-text);
}

.period__dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.period__row--sub {
  justify-content: flex-start;
  flex-wrap: wrap;
  column-gap: var(--gap);
}

.period__range {
  font-size: var(--fs-sm);
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.period__back {
  min-height: 28px;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--red);
}

/* ----------------------------------------------- views and loading --- */
.dashboard-view {
  display: flex;
  flex-direction: column;
  gap: var(--gap-lg);
}

.dashboard-view[hidden] {
  display: none;
}

.is-entering {
  animation: view-in 0.22s ease-out;
}

@keyframes view-in {
  from {
    opacity: 0;
  }
}

.skeleton {
  display: block;
  border-radius: 6px;
  background: var(--surface-muted);
  animation: skeleton-pulse 1.1s ease-in-out infinite alternate;
}

.skeleton--label {
  width: 70%;
  height: 10px;
}

.skeleton--value {
  width: 55%;
  height: 22px;
  margin: 5px 0;
}

.metric.is-skeleton {
  pointer-events: none;
}

.skeleton-card {
  background: var(--surface-muted);
  border-color: var(--divider);
  box-shadow: none;
  animation: skeleton-pulse 1.1s ease-in-out infinite alternate;
}

@keyframes skeleton-pulse {
  to {
    opacity: 0.55;
  }
}

.trend--down {
  color: var(--red-text);
}

.trend--none {
  color: var(--text-muted);
}

.pill--muted {
  background: var(--surface-muted);
  color: var(--text-muted);
}

/* -------------------------------------------- historical dashboard --- */
/* Same cards; neutral heads say "a closed period", green says "done". */
.module--history .module__head {
  background: var(--surface-muted);
}

.module--history:not(.module--compact) .module__title {
  font-size: 1.125rem;
}

.module--history.module--compact .module__head {
  background: var(--bg);
}

.hist-summary {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  margin: 0;
  padding: 10px 14px;
  border-bottom: 1px solid var(--divider);
  font-size: var(--fs-sm);
  color: var(--text-muted);
}

.hist-summary__item {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 600;
}

.hist-summary__item.is-done {
  color: var(--green-text);
}

.hist-summary__item .icon {
  width: 14px;
  height: 14px;
  stroke-width: 3;
}

.event__time {
  font-variant-numeric: tabular-nums;
}

.event--history .event__time {
  font-size: var(--fs-sm);
}

.hist-check,
.hist-open {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
}

.hist-check {
  background: var(--green);
  color: #ffffff;
}

.hist-check .icon {
  width: 13px;
  height: 13px;
  stroke-width: 3.2;
}

.hist-open {
  border: 2px solid #c9ced6;
}

.hist-task {
  display: grid;
  grid-template-columns: 22px minmax(0, 1fr) auto;
  align-items: center;
  column-gap: 12px;
  min-height: 52px;
  padding: 8px 14px;
}

.hist-task__title {
  font-size: var(--fs-md);
  line-height: 1.3;
}

.hist-task:not(.is-done) .hist-task__title {
  color: var(--text-muted);
}

.hist-leads {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px;
}

.hist-big {
  margin: 0;
  font-size: var(--fs-md);
  color: var(--text-muted);
}

.hist-big strong {
  font-size: var(--fs-xl);
  font-weight: 800;
  color: var(--text);
  letter-spacing: -0.02em;
}

.hist-bars {
  display: grid;
  grid-template-columns: max-content minmax(40px, 1fr) 28px;
  row-gap: 8px;
  column-gap: 10px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.hist-bar {
  display: grid;
  grid-column: 1 / -1;
  grid-template-columns: subgrid;
  align-items: center;
  font-size: var(--fs-sm);
}

.hist-bar__track {
  height: 8px;
  border-radius: var(--radius-pill);
  background: var(--bar-track);
  overflow: hidden;
}

.hist-bar__fill {
  display: block;
  width: var(--fill);
  height: 100%;
  border-radius: inherit;
}

.hist-bar__fill--red {
  background: var(--bar-progress);
}

.hist-bar__fill--green {
  background: var(--green);
}

.hist-bar__fill--gray {
  background: var(--bar-new);
}

.hist-bar__value {
  text-align: right;
  font-weight: 600;

.trend--worse {

.trend--better {

}

:root {

  --rv-priority-low: var(--rv-signal-yellow);
  --rv-priority-low-ink: var(--rv-signal-yellow-ink);
  --rv-priority-medium: var(--rv-signal-red);
  --rv-priority-high: var(--rv-signal-black);
}

html.rv-scroll-lock {
  overflow: hidden;
}

/* ------------------------------------------------------------- icons --- */
.rv-icon {
  width: 20px;
  height: 20px;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;

.rv-icon--sm {
  width: 15px;

}

}

.rv-btn:active {
  transform: scale(0.98);
}

.rv-btn:disabled {
  opacity: 0.6;

}

.rv-btn:focus-visible,
.rv-icon-btn:focus-visible,
.rv-link-btn:focus-visible {

.rv-btn .rv-icon {

.rv-btn--primary {

.rv-btn--primary:hover {

  font: inherit;

.rv-switch {

  width: 51px;

.rv-switch__track::after {

  top: 2px;
  left: 2px;
  width: 27px;
  height: 27px;
  border-radius: 50%;
  background: #ffffff;

  transform: translateX(20px);
}

.rv-switch__input:focus-visible + .rv-switch__track {

  outline-offset: 2px;

.rv-contacts,
.rv-timeline,
.rv-list,
.rv-agenda__list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.rv-opp {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 14px 0;
  border-top: 1px solid var(--rv-divider);
}

.rv-opp:first-child {
  border-top: 0;
  padding-top: 2px;
}

.rv-opp__top {
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.rv-opp__title {
  font-size: 15px;
}

.rv-opp__value {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.rv-opp__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-opp__notes {
  margin: 0;
  color: var(--rv-text-2);
  font-size: 13px;
}

/* Offers of an opportunity, its reminder and its actions (send offer, won, lost). */
.rv-offers {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
}

.rv-offer {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  padding: 8px 10px;
  border-radius: var(--rv-radius-sm);
  background: var(--rv-surface-muted);
  font-size: 13px;
}

.rv-offer > .rv-icon {
  color: var(--rv-red);
}

.rv-offer__text {
  display: flex;
  flex: 1 1 160px;
  flex-direction: column;
  min-width: 0;
}

.rv-offer__text span {
  color: var(--rv-muted);
}

.rv-opp__reminder {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 8px 0 0;
  color: var(--rv-text-2);
  font-size: 13px;
}

.rv-opp__reminder.is-failed {
  color: var(--rv-red-text);
}

.rv-opp__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
}

/* timeline */
.rv-timeline__item {
  position: relative;
  display: flex;
  gap: 14px;
  padding-bottom: 18px;
}

.rv-timeline__item:not(:last-child)::before {
  content: '';
  position: absolute;
  top: 38px;
  bottom: 2px;
  left: 17px;
  width: 2px;
  background: var(--rv-divider);
}

.rv-timeline__icon {
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
}

.rv-timeline__icon .rv-icon {
  width: 17px;
  height: 17px;
}

.rv-timeline__icon--red {
  background: var(--rv-red-soft);
  color: var(--rv-red);
}

.rv-timeline__icon--green {
  background: var(--rv-green-soft);
  color: var(--rv-green-text);
}

.rv-timeline__icon--neutral {
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
}

.rv-timeline__body {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  padding-top: 2px;
}

.rv-timeline__title {
  margin: 0;
  font-size: 15px;
  font-weight: 700;
}

.rv-timeline__desc {
  margin: 0;
  color: var(--rv-text-2);
  font-size: 14px;
  line-height: 1.45;
  white-space: pre-line;
  overflow-wrap: anywhere;
}

.rv-timeline__time {
  margin: 0;
  color: var(--rv-muted);
  font-size: 12.5px;
}

/* tasks */
.rv-task {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  padding: 4px 0;
  border-top: 1px solid var(--rv-divider);
}

.rv-tasks .rv-task:first-child {
  border-top: 0;
}

.rv-task__check {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
}

.rv-task__check::before {
  content: '';
  grid-area: 1 / 1;
  width: 24px;
  height: 24px;
  border: 2px solid var(--rv-red);
  border-radius: 50%;
  box-sizing: border-box;
}

.rv-task__check .rv-icon {
  grid-area: 1 / 1;
  width: 14px;
  height: 14px;
  stroke-width: 3.2;
  color: #ffffff;
  opacity: 0;
}

.rv-task__check[aria-pressed='true']::before {
  border-color: var(--rv-green);
  background: var(--rv-green);
}

.rv-task__check[aria-pressed='true'] .rv-icon {
  opacity: 1;
}

.rv-task__check:focus-visible {
  outline: 2px solid var(--rv-red);
  outline-offset: -2px;
}

.rv-task__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.rv-task__title {
  font-size: 14.5px;
  font-weight: 600;
}

.rv-task.is-done .rv-task__title {
  color: var(--rv-muted);
}

.rv-task__meta {
  color: var(--rv-muted);
  font-size: 12.5px;
}

/* contacts */
.rv-contact {
  display: flex;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--rv-divider);
}

.rv-contact:first-child {
  border-top: 0;
  padding-top: 2px;
}

.rv-contact__avatar {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 50%;
  background: var(--rv-surface-muted);
  color: var(--rv-text-2);
  font-size: 14px;
  font-weight: 700;
}

.rv-contact__text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
  font-size: 14px;
}

.rv-contact__role {
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-contact__channels {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 14px;
  color: var(--rv-text-2);
  font-size: 13px;
}

.rv-contact__channels span {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

/* ------------------------------------------------------ customer list --- */
.rv-list {
  overflow: hidden;
}

.rv-list li + li {
  border-top: 1px solid var(--rv-divider);
}

.rv-list__row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto auto 16px;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  text-decoration: none;
}

.rv-list__row:hover {
  background: var(--rv-surface-muted);
}

.rv-list__icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--rv-red-soft);
  color: var(--rv-red);
}

.rv-list__main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.rv-list__main span,
.rv-list__date {
  color: var(--rv-muted);
  font-size: 13px;
}

.rv-list__chevron {
  width: 16px;
  height: 16px;
  color: #9aa0a8;
}

@media (max-width: 720px) {
  .rv-list__row {
    grid-template-columns: 40px minmax(0, 1fr) auto 16px;
  }

  .rv-list__date {
    display: none;
  }
}

/* ------------------------------------------------------------ board --- */
.rv-board {
  display: grid;
  grid-template-columns: repeat(5, minmax(220px, 1fr));
  gap: 14px;
  overflow-x: auto;
  padding-bottom: 8px;
}

.rv-board__col {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  padding: 12px;
  border-radius: var(--rv-radius);
  background: var(--rv-surface-muted);
}

.rv-board__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 2px 4px 4px;
}

.rv-board__head h2 {
  margin: 0;
  font-size: 14px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.rv-board__count {
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.rv-board__card {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 14px;
  font-size: 14px;
  text-decoration: none;
}

.rv-board__card:hover {
  border-color: #f3c3c3;
}

.rv-board__customer {
  color: var(--rv-red-text);
  font-size: 13px;
  font-weight: 600;
}

.rv-board__meta,
.rv-board__demo {
  margin: 0;
  color: var(--rv-muted);
  font-size: 12.5px;
}

.rv-board__demo {
  padding: 0 4px;
}

/* ------------------------------------------------------------ agenda --- */
.rv-agenda {
  margin-bottom: 14px;
  padding: 16px 20px 8px;
}

.rv-agenda__day {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 800;
}

.rv-agenda__list li + li {
  border-top: 1px solid var(--rv-divider);
}

.rv-agenda__row {
  display: grid;
  grid-template-columns: 52px 12px minmax(0, 1fr) 16px;
  align-items: center;
  gap: 12px;
  padding: 12px 0;
  text-decoration: none;
}

a.rv-agenda__row:hover {
  background: var(--rv-surface-muted);
}

.rv-agenda__time {
  font-variant-numeric: tabular-nums;
  color: var(--rv-text-2);
}

.rv-agenda__dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--rv-green);
}

.rv-agenda__dot--demo {
  background: #c9ced6;
}

.rv-agenda__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: 14.5px;
}

.rv-agenda__text span {
  color: var(--rv-muted);
  font-size: 13px;
}

@media (max-width: 720px) {
  .rv-topbar__inner {
    flex-wrap: wrap;
    gap: 8px 12px;
    padding-left: 16px;
    padding-right: 16px;
  }

  .rv-topbar__nav {
    order: 3;
    width: 100%;
    margin-left: 0;
  }

  .rv-topbar__user {
    margin-left: auto;
  }

  .rv-page {
    padding: 16px 16px 48px;
  }

  .rv-section-nav {
    top: 108px;
  }

  .rv-profile-header__name {
    font-size: 24px;
  }

  /* Profile header on phones: compact identity, actions as an even grid. */
  .rv-profile-header {
    gap: 18px;
    padding: 18px 16px;
  }

  .rv-profile-header__identity {
    flex-basis: 100%;
    gap: 14px;
  }

  .rv-company-avatar {
    width: 52px;
    height: 52px;
    border-radius: 15px;
    font-size: 18px;
  }

  .rv-profile-header__meta {
    flex-direction: column;
    gap: 3px;
  }

  .rv-profile-actions__primary,
  .rv-profile-actions__secondary {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    width: 100%;
  }

  .rv-profile-actions__primary .rv-btn:last-child {
    grid-column: 1 / -1;
  }

  .rv-profile-actions .rv-btn {
    width: 100%;
    min-width: 0;
    padding: 0 10px;
    font-size: 14.5px;
  }

  .rv-profile-actions .rv-btn--soft {
    font-size: 13.5px;
  }
}

/* --------------------------------------------- tasks: list and groups --- */
.rv-task {
  grid-template-columns: 44px minmax(0, 1fr);
}

.rv-task__link {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto 16px;
  align-items: center;
  gap: 8px;
  min-height: 52px;
  color: inherit;
  text-decoration: none;
}

.rv-task__check:disabled {
  opacity: 0.4;
  cursor: default;
}

.rv-task-group {
  margin-bottom: 14px;
  padding: 16px 16px 8px;
}

.rv-task-group__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 4px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.rv-task-group__empty {
  margin: 6px 0 10px;
  font-size: 14px;
}

.rv-search {
  width: 100%;
  margin-bottom: 14px;
}

/* Next action of an opportunity (ADR-0004). */
.rv-next-action {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 0;
  color: var(--rv-text-2);
  font-size: 13px;
  text-decoration: none;
}

.rv-next-action > span {
  flex: 1 1 0;
  min-width: 0;
}

.rv-next-action--missing {
  padding: 8px 10px;
  border-radius: var(--rv-radius-sm);
  background: var(--rv-red-soft);
  color: var(--rv-red-text);
  font-weight: 600;
}

.rv-board__link {
  display: flex;
  flex-direction: column;
  gap: 4px;
  color: inherit;
  text-decoration: none;
}

a.rv-upcoming__item {
  color: inherit;
  text-decoration: none;
}

/* ----------------------------------------------- calendar: week view --- */
.rv-week-nav {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
}

.rv-week-nav .rv-btn[aria-current='true'] {
  border-color: var(--rv-red);
  color: var(--rv-red-text);
}

.rv-agenda.is-today {
  box-shadow:
    inset 3px 0 0 var(--rv-red),
    var(--rv-shadow-card);
}

.rv-agenda__row {
  grid-template-columns: 84px 12px minmax(0, 1fr) 18px 16px;
  color: inherit;
}

.rv-agenda__row.is-done strong {
  color: var(--rv-muted);
}

.rv-agenda__dot--red {
  background: var(--rv-red);
}

.rv-agenda__check {
  width: 16px;
  height: 16px;
  margin-left: -2px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--rv-green);
  color: #ffffff;
}

.rv-agenda__check .rv-icon {
  width: 11px;
  height: 11px;
  stroke-width: 3.4;
}

.rv-agenda__type {
  color: #9aa0a8;
}

.rv-agenda__empty {
  margin: 0 0 10px;
  font-size: 14px;
}

@media (max-width: 420px) {
  .rv-agenda {
    padding: 14px 14px 6px;
  }

  .rv-agenda__row {
    grid-template-columns: 72px 12px minmax(0, 1fr) 16px;
    gap: 10px;
  }

  .rv-agenda__type {
    display: none;
  }
}
`,"app/css/screen.css":`/* Renvara · dedicated task screens (mobile navigation push), e.g. /customers/new.
   Mobile first: one column, no bottom navigation, page scrolls with the keyboard. */

*,
*::before,
*::after {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--rv-bg);
}

body {
  -webkit-tap-highlight-color: transparent;
  color: var(--rv-ink);
  font-family: var(--rv-font);
  -webkit-font-smoothing: antialiased;
}

/* Natural document flow (no fixed-height container) so the virtual keyboard never traps fields. */
.rv-screen {
  min-height: 100vh;
  animation: rv-push-in 0.26s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes rv-push-in {
  from {
    opacity: 0;
    transform: translateX(28px);
  }
}

.rv-screen__header {
  position: sticky;
  top: 0;
  z-index: 20;
  padding-top: env(safe-area-inset-top, 0px);
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--rv-border);
}

.rv-screen__header-inner {
  display: flex;
  align-items: center;
  gap: 4px;
  max-width: 560px;
  min-height: 56px;
  margin: 0 auto;
  padding: 0 8px;
}

.rv-screen__back {
  color: var(--rv-ink);
}

.rv-screen__back .rv-icon {
  width: 26px;
  height: 26px;
}

.rv-screen__back:disabled {
  opacity: 0.4;
}

.rv-screen__title {
  margin: 0;
  font-size: 17px;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.rv-screen__title:focus {
  outline: none;
}

.rv-screen__body {
  max-width: 560px;
  margin: 0 auto;
  padding: 20px 16px calc(env(safe-area-inset-bottom, 0px) + 32px);
}

/* Mobile-sized controls: 16px text avoids iOS zoom-on-focus; ≥48px touch height. */
.rv-screen .rv-form {
  gap: 28px;
}

.rv-screen .rv-form__section-title {
  font-size: 12px;
}

.rv-screen .rv-field__label {
  font-size: 14px;
}

.rv-screen .rv-input {
  min-height: 48px;
  font-size: 16px;
}

.rv-screen .rv-field {
  scroll-margin: 88px 0 120px;
}

.rv-screen__error {
  margin: 20px 0 0;
  padding: 12px 14px;
  border-radius: var(--rv-radius-field);
  background: var(--rv-red-soft);
  color: var(--rv-red-text);
  font-size: 14px;
  font-weight: 600;
}

.rv-screen__error[hidden] {
  display: none;
}

.rv-screen__actions {
  display: flex;
  gap: 10px;
  margin-top: 28px;
}

.rv-screen__actions .rv-btn {
  min-height: 52px;
  border-radius: 14px;
  font-size: 15px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.rv-screen__actions .rv-btn--secondary {
  flex: 1 1 0;
}

.rv-screen__actions .rv-btn--primary {
  flex: 2 1 0;
}

@media (prefers-reduced-motion: reduce) {
  .rv-screen {
    animation: none;
  }
}

.rv-screen__loading {
  color: var(--rv-muted);
}

/* Time pickers side by side on the task screen. */
.rv-screen .rv-form__grid:has(> [data-field='startTime']) {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.rv-screen .rv-form__grid:has(> [data-field='startTime']) > :not([data-field$='Time']) {
  grid-column: 1 / -1;
}

/* Task detail */
.rv-task-detail {
  padding: 18px 18px 8px;
}

.rv-task-detail__badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.rv-task-detail__title {
  margin: 12px 0 8px;
  font-size: 21px;
  font-weight: 800;
  line-height: 1.25;
  overflow-wrap: anywhere;
}

.rv-task-detail .rv-dl a {
  color: var(--rv-red-text);
  font-weight: 600;
}

.rv-screen__actions--stack {
  flex-direction: column;
}

.rv-screen__actions--stack .rv-btn {
  width: 100%;
}
`,"app/css/leads.css":`/* Renvara · Leads list (/leads), Lead detail (/leads/{id}) and conversion
   (/leads/{id}/convert). Uses the shared rv- tokens from components.css. */

/* ------------------------------------------------------------- list --- */
.leads__filters {
  padding: 12px 14px 4px;
}

.leads__filters .rv-segmented__option span {
  gap: 5px;
  min-height: 34px;
  font-size: 13px;
}

.leads__count {
  font-size: 11px;
  font-weight: 600;
  color: var(--rv-muted);
  font-variant-numeric: tabular-nums;
}

.leads__list {
  padding: 4px 0 6px;
}

.leads__empty {
  margin: 0;
  padding: 18px 14px 22px;
  color: var(--rv-muted);
  font-size: 14px;
}

.lead-row {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) auto 16px;
  align-items: center;
  column-gap: 10px;
  min-height: 68px;
  padding: 10px 12px 10px 14px;
  color: inherit;
  text-decoration: none;
}

.lead-row:active {
  background: var(--rv-surface-muted);
}

.lead-row__avatar {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--rv-red-soft);
  color: var(--rv-red-text);
  font-size: 14px;
  font-weight: 700;
}

.lead-row[data-status='won'] .lead-row__avatar {
  background: var(--rv-green-soft);
  color: var(--rv-green-text);
}

.lead-row[data-status='lost'] .lead-row__avatar {
  background: var(--rv-surface-muted);
  color: var(--rv-muted);
}

.lead-row__text,
.lead-row__side {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.lead-row__side {
  align-items: flex-end;
  gap: 4px;
}

.lead-row__name {
  overflow: hidden;
  font-size: 15px;
  font-weight: 600;
  line-height: 1.25;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lead-row__company,
.lead-row__meta {
  overflow: hidden;
  font-size: 12.5px;
  color: var(--rv-muted);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lead-row__company {
  color: var(--rv-text-2);
}

.lead-row__value {
  font-size: 12.5px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.lead-row .rv-badge {
  min-height: 20px;
  padding: 0 8px;
  font-size: 11px;
}

/* ----------------------------------------------------------- detail --- */
.lead-detail__company {
  margin: -4px 0 12px;
  color: var(--rv-text-2);
  font-size: 15px;
  font-weight: 600;
}

.lead-detail__stage {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 4px 0 12px;
}

.lead-detail__stage .rv-segmented__option span {
  font-size: 13px;
}

.lead-detail .rv-dl a {
  color: var(--rv-red-text);
  font-weight: 600;
}

.lead-outcome {
  margin: 8px 0 12px;
  padding: 12px 14px 4px;
  border-radius: var(--rv-radius-field);
}

.lead-outcome--won {
  background: var(--rv-green-soft);
}

.lead-outcome--lost {
  background: var(--rv-surface-muted);
}

.lead-outcome__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 6px;
  font-size: 14px;
  font-weight: 700;
}

.lead-outcome--won .lead-outcome__title {
  color: var(--rv-green-text);
}

.lead-outcome .rv-dl__row {
  border-top-color: rgba(17, 17, 17, 0.06);
}

.lead-section {
  margin-top: 16px;
  padding: 16px 16px 12px;
}

.lead-section__title {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 8px;
  font-size: 15px;
  font-weight: 800;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}

.lead-section__count {
  color: var(--rv-muted);
  font-size: 12.5px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
}

.lead-section__empty {
  margin: 0 0 6px;
  color: var(--rv-muted);
  font-size: 14px;
}

/* Lost sheet */
.lead-sheet__text {
  margin: 0;
  color: var(--rv-text-2);
  font-size: 14px;
  line-height: 1.4;
}

.lead-reasons {
  display: flex;
  flex-direction: column;
}

.lead-reasons__option {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: 46px;
  border-top: 1px solid var(--rv-divider);
  font-size: 15px;
  cursor: pointer;
}

.lead-reasons__option:first-child {
  border-top: 0;
}

.lead-reasons__option input {
  width: 20px;
  height: 20px;
  margin: 0;
  accent-color: var(--rv-red);
}

.rv-sheet--lead-lost .rv-input {
  min-height: 48px;
  font-size: 16px;
}

.lead-sheet__actions {
  display: flex;
  gap: 10px;
  padding-top: 4px;
}

.lead-sheet__actions .rv-btn {
  min-height: 50px;
  border-radius: 14px;
}

.lead-sheet__actions .rv-btn--secondary {
  flex: 1 1 0;
}

.lead-sheet__actions .rv-btn--primary {
  flex: 2 1 0;
}

/* ----------------------------------------------------------- convert --- */
.lead-convert__lead strong {
  font-weight: 700;
}

.lead-matches {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
  border: 1px solid #f6c9c9;
  border-radius: var(--rv-radius-field);
  background: var(--rv-red-tint);
}

.lead-matches[hidden] {
  display: none;
}

.lead-matches__title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0;
  color: var(--rv-red-text);
  font-size: 14px;
  font-weight: 700;
}

.lead-matches__list {
  margin: 0;
  padding: 0;
  list-style: none;
}

.lead-matches__item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 0;
  border-top: 1px solid rgba(200, 30, 30, 0.12);
}

.lead-matches__item:first-child {
  border-top: 0;
}

.lead-matches__text {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: 14px;
}

.lead-matches__text span {
  color: var(--rv-muted);
  font-size: 12.5px;
}
