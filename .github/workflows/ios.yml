name: iOS

# Renvara iOS app (apps/ios), on macOS with Xcode 26:
#   - a push that changes apps/ios: unsigned simulator build (does it compile?)
#   - a tag ios-* or "Run workflow": archive, sign and upload to TestFlight
#     (needs the App Store Connect secrets; see apps/ios/README.md)
on:
  push:
    branches: ['**']
    tags: ['ios-*']
    paths:
      - 'apps/ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:
    inputs:
      content:
        description: 'Built-in app: clean (empty start) or demo (with demo data)'
        type: choice
        options: [clean, demo]
        default: clean
      server_url:
        description: 'Or an https address of a Renvara BETA server (empty = built-in app)'
        type: string
        required: false

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Xcode build (simulator, unsigned)
    if: github.event_name == 'push' && github.ref_type == 'branch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xcodebuild -version
      - run: apps/ios/scripts/testflight.sh check

  testflight:
    name: Archive and upload to TestFlight
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    runs-on: macos-26
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      RENVARA_IOS_CONTENT: ${{ inputs.content || 'clean' }}
      RENVARA_IOS_SERVER_URL: ${{ inputs.server_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID IOS_BUNDLE_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets/variables:$missing (apps/ios/README.md)"
            exit 1
          fi
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: xcodebuild -version
      - run: apps/ios/scripts/testflight.sh upload
      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
